<!DOCTYPE html><html lang="sv"><head>

  <style>

    }body {

</head><body>  <div class="container"><h1>🛒 Priskorgen</h1>

<p class="subtitle">
  Hitta billigaste sättet att handla din korg.
</p>

<div class="box">

  <label for="postcode">📍 Postnummer</label>

  <input
    id="postcode"
    type="text"
    value="89132"
    maxlength="5"
    inputmode="numeric"
  >

  <br><br>

  <label for="shoppingList">🛍️ Din inköpslista</label>

  <textarea
    id="shoppingList"
    placeholder="Skriv en vara per rad, till exempel:

Mjölk
Bananer
Kaffe
Smör
Bröd"
></textarea>

</div>

<div id="results" class="hidden">

    <div id="cheapestResults"></div>
  </div>

  <div class="box">
    <h2>🏪 En butik</h2>
    <div id="oneStoreResults"></div>
  </div>

  <div class="box">
    <h2>🚗 Smartast</h2>

    <div class="smart">

      <div class="smart-title">
        Smartaste alternativet
      </div>

      <div id="smartResults">
        Vi räknar på pris och antal butiker.
      </div>

    </div>
  </div>

</div>

<div class="attribution">
  Prisdata från
  <a href="https://primat.nu" target="_blank" rel="noopener">
    primat.nu
  </a>
</div>

  </div>  <script>

    const compareButton =
      document.getElementById("compareButton");

    const postcodeInput =
      document.getElementById("postcode");

    const shoppingList =
      document.getElementById("shoppingList");

    const results =
      document.getElementById("results");

    const summary =
      document.getElementById("summary");

    const cheapestResults =
      document.getElementById("cheapestResults");

    const oneStoreResults =
      document.getElementById("oneStoreResults");

    const smartResults =
      document.getElementById("smartResults");

    const message =
      document.getElementById("message");


    const storeNames = {
      coop: "Coop",
      ica: "ICA",
      lidl: "Lidl",
      willys: "Willys",
      hemkop: "Hemköp"
    };


    function formatPrice(price) {

      if (
        price === null ||
        price === undefined
      ) {
        return "–";
      }

      return Number(price)
        .toFixed(2)
        .replace(".", ",") + " kr";
    }


    function escapeHtml(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function getStoreName(product) {

      return storeNames[product.chain] ||
        product.chain;
    }


    /*
     * NORMALISERING
     */

    function normalizeText(text) {

      return String(text)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9åäö\s]/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
    }


    function singularizeWord(word) {

      if (
        word.length > 5 &&
        word.endsWith("or")
      ) {
        return word.slice(0, -2);
      }

      if (
        word.length > 5 &&
        word.endsWith("ar")
      ) {
        return word.slice(0, -2);
      }

      if (
        word.length > 5 &&
        word.endsWith("er")
      ) {
        return word.slice(0, -2);
      }

      if (
        word.length > 5 &&
        word.endsWith("en")
      ) {
        return word.slice(0, -2);
      }

      if (
        word.length > 5 &&
        word.endsWith("et")
      ) {
        return word.slice(0, -2);
      }

      return word;
    }


    /*
     * ORD SOM TYDLIGT PEKAR PÅ FEL PRODUKT.
     */

    const excludedWords = {

      mjolk: [
        "baby",
        "babys",
        "babysemp",
        "ersattning",
        "mjolkersattning",
        "havredryck",
        "mandeldryck",
        "sojadryck",
        "kokosdryck",
        "chokladmjolk",
        "kaffemjolk"
      ],

      smor: [
        "smordeg",
        "smorgas",
        "smorgasfett",
        "smorj",
        "margarin",
        "bregott",
        "rapsolja",
        "raps",
        "jordnotssmor",
        "jordnot",
        "mandelsmor",
        "kryddsmor",
        "vitlokssmor",
        "persiljesmor",
        "vitlok",
        "smorkn",
        "smorkniv",
        "smorkringla",
        "smorgasgurka",
        "smorgaspapper",
        "smorgasgrill",
        "smorgaskex",
        "smorgasran",
        "smorgasr",
        "smordejsplattor",
        "smordejsplatta"
      ],

      kaffe: [
        "kaffefilter",
        "kaffemugg",
        "kaffemaskin",
        "kaffekvarn",
        "kaffeservis"
      ],

      brod: [
        "knackebrod",
        "skorpor",
        "brodmix",
        "brodpudding",
        "brodpinnar",
        "french",
        "twists",
        "breadsticks",
        "grissini"
      ]
    };


    function getSearchTerms(item) {

      return normalizeText(item)
        .split(" ")
        .filter(Boolean)
        .map(singularizeWord);
    }


    function productText(product) {

      return normalizeText(
        [
          product.name || "",
          product.brand || "",
          product.category || "",
          product.package || ""
        ].join(" ")
      );
    }


    function getProductWords(product) {

      return productText(product)
        .split(" ")
        .filter(Boolean)
        .map(singularizeWord);
    }


    function categoryText(product) {

      return normalizeText(
        product.category || ""
      );
    }


    function hasWholeWord(product, word) {

      if (!word) {
        return false;
      }

      return getProductWords(product)
        .includes(word);
    }


    function getConcept(item) {

      const text =
        normalizeText(item);

      if (
        text === "mjolk" ||
        text === "mjolken"
      ) {
        return "mjolk";
      }

      if (
        text === "smor" ||
        text === "smoret"
      ) {
        return "smor";
      }

      if (text === "kaffe") {
        return "kaffe";
      }

      if (
        text === "brod" ||
        text === "brodet"
      ) {
        return "brod";
      }

      if (
        text === "banan" ||
        text === "bananer"
      ) {
        return "banan";
      }

      return null;
    }


    function containsExcludedWord(
      product,
      exclusions
    ) {

      const words =
        getProductWords(product);

      return exclusions.some(
        excluded => words.includes(excluded)
      );
    }


    /*
     * SMÖR-SPECIFIKA KONTROLLER
     */

    function isOrdinaryButter(product) {

      const name =
        normalizeText(product.name || "");

      const category =
        categoryText(product);

      const brand =
        normalizeText(product.brand || "");

      const combined =
        productText(product);


      /*
       * Dessa är inte vanligt smör.
       */

      const badTerms = [
        "bregott",
        "smor raps",
        "smor rapsolja",
        "rapsolja",
        "raps",
        "margarin",
        "smorgas",
        "smordeg",
        "jordnotssmor",
        "jordnot",
        "mandelsmor",
        "kryddsmor",
        "vitlokssmor",
        "persiljesmor",
        "smorkniv",
        "smorkringla",
        "smorgasgurka",
        "smorgaspapper",
        "smorgasgrill",
        "smorgaskex"
      ];


      for (const term of badTerms) {

        if (
          name.includes(term) ||
          brand.includes(term)
        ) {
          return false;
        }
      }


      /*
       * Rätt kategori är den starkaste signalen.
       *
       * Exempel:
       * "Mejeri & Ost > Smör & Margarin > Matfett smör"
       */

      if (
        category.includes("matfett smor")
      ) {
        return true;
      }


      /*
       * Även andra kategorier under smör
       * kan innehålla riktiga smörprodukter.
       */

      if (
        category.includes("smor & margarin") &&
        (
          name.includes("smor") ||
          name.includes("smorstav")
        ) &&
        !name.includes("bregott")
      ) {
        return true;
      }


      /*
       * Namnet måste då tydligt säga smör.
       */

      if (
        hasWholeWord(product, "smor") &&
        (
          name.includes("normalsaltat") ||
          name.includes("osaltat") ||
          name.includes("extrasaltat") ||
          name.includes("80%") ||
          name.includes("81%") ||
          name.includes("82%")
        )
      ) {
        return true;
      }


      /*
       * "Smörstav" är fortfarande riktigt smör.
       */

      if (
        name.includes("smorstav") &&
        !name.includes("smorgas")
      ) {
        return true;
      }


      return false;
    }


    /*
     * MATCHNING
     */

    function scoreProduct(item, product) {

      if (
        !product ||
        product.available === false ||
        !product.prices ||
        typeof product.prices.effective !== "number"
      ) {
        return -Infinity;
      }


      const query =
        normalizeText(item);

      const queryWords =
        getSearchTerms(item);

      const name =
        normalizeText(product.name || "");

      const category =
        categoryText(product);

      const brand =
        normalizeText(product.brand || "");

      const productWords =
        getProductWords(product);


      let score = 0;


      /*
       * EXAKT NAMN
       */

      if (name === query) {
        score += 150;
      }


      /*
       * ORDTRÄFFAR
       */

      for (const word of queryWords) {

        if (!word) {
          continue;
        }

        if (
          productWords.includes(word)
        ) {
          score += 40;
        }

        if (
          category
            .split(" ")
            .map(singularizeWord)
            .includes(word)
        ) {
          score += 20;
        }

        if (brand === word) {
          score += 5;
        }
      }


      /*
       * NAMNET INNEHÅLLER SÖKNINGEN
       */

      if (
        name.includes(query)
      ) {
        score += 15;
      }


      if (
        name.startsWith(query)
      ) {
        score += 10;
      }


      const concept =
        getConcept(item);


      /*
       * MJÖLK
       */

      if (concept === "mjolk") {

        const hasMilkWord =
          hasWholeWord(product, "mjolk");

        const excluded =
          containsExcludedWord(
            product,
            excludedWords.mjolk
          );

        if (
          hasMilkWord &&
          !excluded
        ) {
          score += 100;
        }

        if (
          category.includes("mjolk")
        ) {
          score += 35;
        }

        if (
          name.includes("standardmjolk") ||
          name.includes("mellanmjolk") ||
          name.includes("lattemjolk")
        ) {
          score += 25;
        }
      }


      /*
       * SMÖR
       *
       * Här använder vi produktkategori
       * mycket hårdare än tidigare.
       */

      if (concept === "smor") {

        const ordinaryButter =
          isOrdinaryButter(product);

        const excluded =
          containsExcludedWord(
            product,
            excludedWords.smor
          );


        /*
         * Om det uttryckligen är en
         * blandning/margarinprodukt
         * ska den inte kunna vinna på pris.
         */

        if (
          excluded ||
          !ordinaryButter
        ) {
          score -= 500;
        }


        if (ordinaryButter) {

          /*
           * Mycket stark signal:
           * kategori = Matfett smör
           */

          if (
            category.includes("matfett smor")
          ) {
            score += 180;
          }


          /*
           * Vanliga smörvarianter.
           */

          if (
            name.includes("normalsaltat")
          ) {
            score += 50;
          }

          if (
            name.includes("osaltat")
          ) {
            score += 45;
          }

          if (
            name.includes("extrasaltat")
          ) {
            score += 45;
          }


          /*
           * Typiska fetthalter för smör.
           */

          if (
            name.includes("82%") ||
            name.includes("81%") ||
            name.includes("80%")
          ) {
            score += 35;
          }


          if (
            hasWholeWord(product, "smor")
          ) {
            score += 100;
          }
        }
      }


      /*
       * BANAN
       */

      if (concept === "banan") {

        if (
          hasWholeWord(product, "banan")
        ) {
          score += 100;
        }

        if (
          category.includes("frukt") ||
          category.includes("banan")
        ) {
          score += 30;
        }
      }


      /*
       * KAFFE
       */

      if (concept === "kaffe") {

        const hasCoffeeWord =
          hasWholeWord(product, "kaffe");

        const excluded =
          containsExcludedWord(
            product,
            excludedWords.kaffe
          );

        if (
          hasCoffeeWord &&
          !excluded
        ) {
          score += 100;
        }

        if (
          category.includes("kaffe")
        ) {
          score += 40;
        }

        if (
          name.includes("bryggkaffe") ||
          name.includes("kaffebonor") ||
          name.includes("kaffebon") ||
          name.includes("mellanrost") ||
          name.includes("morkrost") ||
          name.includes("ljusrost")
        ) {
          score += 20;
        }
      }


      /*
       * BRÖD
       */

      if (concept === "brod") {

        const hasBreadWord =
          hasWholeWord(product, "brod");

        const excluded =
          containsExcludedWord(
            product,
            excludedWords.brod
          );

        if (
          hasBreadWord &&
          !excluded
        ) {
          score += 110;
        }

        if (
          category.includes("brod") &&
          !excluded
        ) {
          score += 40;
        }

        if (excluded) {
          score -= 300;
        }
      }


      /*
       * GENERELLA EXKLUDERINGAR
       */

      const exclusions =
        excludedWords[concept] || [];


      if (
        containsExcludedWord(
          product,
          exclusions
        )
      ) {
        score -= 250;
      }


      /*
       * ENSAMT SÖKORD
       */

      if (
        queryWords.length === 1
      ) {

        const word =
          queryWords[0];

        const exactWord =
          productWords.includes(word);

        const categoryMatch =
          category
            .split(" ")
            .map(singularizeWord)
            .includes(word);


        if (
          !exactWord &&
          !categoryMatch
        ) {
          score -= 100;
        }
      }


      /*
       * SMÅ FÖRPACKNINGAR
       */

      if (
        product.amount &&
        Number(product.amount) < 100 &&
        (
          concept === "mjolk" ||
          concept === "smor" ||
          concept === "brod"
        )
      ) {
        score -= 20;
      }


      return score;
    }


    async function getProducts(
      query,
      postcode
    ) {

      const url =
        "/api/primat?q=" +
        encodeURIComponent(query) +
        "&postcode=" +
        encodeURIComponent(postcode);


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Kunde inte hämta prisdata för " +
          query
        );
      }


      const data =
        await response.json();


      if (
        !data.products ||
        !data.products.data
      ) {
        return [];
      }


      return data.products.data;
    }


    /*
     * VÄLJ BÄSTA PRODUKT
     */

    function chooseBestProduct(
      item,
      products
    ) {

      const valid =
        products.filter(product => {

          return product &&
            product.available !== false &&
            product.prices &&
            typeof product.prices.effective === "number";

        });


      if (!valid.length) {
        return null;
      }


      const scored =
        valid.map(product => {

          return {
            product,

            score:
              scoreProduct(
                item,
                product
              )

          };

        });


      scored.sort((a, b) => {

        if (
          b.score !== a.score
        ) {
          return b.score - a.score;
        }


        return (
          a.product.prices.effective -
          b.product.prices.effective
        );

      });


      const winner =
        scored[0];


      /*
       * Säkerhetsgräns.
       */

      if (
        !winner ||
        winner.score < 25
      ) {
        return null;
      }


      return winner.product;
    }


    function createItemHtml(
      item,
      products
    ) {

      const best =
        chooseBestProduct(
          item,
          products
        );


      if (!best) {

        return `
          <div class="item">

            <div class="item-name">
              ${escapeHtml(item)}
            </div>

            <div class="empty">
              Ingen tillräckligt säker produktmatch hittades.
            </div>

          </div>
        `;
      }


      const price =
        best.prices.effective;


      const store =
        getStoreName(best);


      const packageText =
        best.package ||
        (
          best.amount
            ? best.amount + " " +
              (best.unit || "")
            : ""
        );


      return `
        <div class="item">

          <div class="item-name">
            ${escapeHtml(best.name)}
          </div>

          <div class="item-meta">
            ${escapeHtml(best.brand || "")}
            ${
              packageText
                ? " • " +
                  escapeHtml(packageText)
                : ""
            }
          </div>

          <div class="cheapest">

            <div class="best-label">
              BILLIGAST HITTAT
            </div>

            <div class="store-row">

              <span class="store-name">
                ${escapeHtml(store)}
              </span>

              <span class="price">
                ${formatPrice(price)}
              </span>

            </div>

          </div>

        </div>
      `;
    }


    function calculateStoreTotals(
      allResults
    ) {

      const totals = {};


      for (const result of allResults) {

        const product =
          chooseBestProduct(
            result.item,
            result.products
          );


        if (
          !product ||
          !product.prices ||
          typeof product.prices.effective !== "number"
        ) {
          continue;
        }


        const storeKey =
          product.chain +
          ":" +
          product.store_id;


        if (!totals[storeKey]) {

          totals[storeKey] = {

            chain:
              product.chain,

            store_id:
              product.store_id,

            name:
              getStoreName(product),

            total: 0,

            items: 0

          };
        }


        totals[storeKey].total +=
          product.prices.effective;

        totals[storeKey].items +=
          1;
      }


      return Object.values(totals);
    }


    function renderOneStore(
      allResults
    ) {

      const totals =
        calculateStoreTotals(
          allResults
        );


      if (!totals.length) {

        oneStoreResults.innerHTML =
          '<div class="empty">Ingen butik kunde räknas fram.</div>';

        return;
      }


      totals.sort(
        (a, b) =>
          a.total - b.total
      );


      const best =
        totals[0];


      oneStoreResults.innerHTML = `

        <div class="item">

          <div class="item-name">
            🏆 ${escapeHtml(best.name)}
          </div>

          <div class="item-meta">
            ${best.items} av
            ${allResults.length}
            varor kunde matchas i denna butik.
          </div>

          <div class="cheapest">

            <div class="best-label">
              LÄGSTA TOTALEN HITTILLS
            </div>

            <div class="store-row">

              <span class="store-name">
                ${escapeHtml(best.name)}
              </span>

              <span class="price">
                ${formatPrice(best.total)}
              </span>

            </div>

          </div>

        </div>
      `;
    }


    function renderSmart(
      allResults
    ) {

      const totals =
        calculateStoreTotals(
          allResults
        );


      if (!totals.length) {

        smartResults.innerHTML =
          "Vi hittade inte tillräckligt med data ännu.";

        return;
      }


      totals.sort(
        (a, b) =>
          a.total - b.total
      );


      const cheapest =
        totals[0];


      smartResults.innerHTML = `

        <strong>
          ${escapeHtml(cheapest.name)}
        </strong>
        är just nu det bästa alternativet bland de butiker
        där vi har hittat priser.

        <br><br>

        Total för matchade varor:
        <strong>
          ${formatPrice(cheapest.total)}
        </strong>

        <br><br>

        <small>
          🚗 Nästa steg blir att väga in avstånd, restid och
          hur mycket du faktiskt sparar på att åka till flera butiker.
        </small>
      `;
    }


    compareButton.addEventListener(
      "click",
      async function() {

        const postcode =
          postcodeInput.value.trim();


        const items =
          shoppingList.value
            .split("\n")
            .map(item => item.trim())
            .filter(
              item =>
                item.length > 0
            );


        message.innerHTML = "";

        results.classList.add(
          "hidden"
        );


        if (!postcode) {

          message.innerHTML =
            '<div class="error">Skriv in ditt postnummer.</div>';

          return;
        }


        if (!/^\d{5}$/.test(postcode)) {

          message.innerHTML =
            '<div class="error">Postnumret måste innehålla 5 siffror.</div>';

          return;
        }


        if (!items.length) {

          message.innerHTML =
            '<div class="error">Skriv minst en vara i inköpslistan.</div>';

          return;
        }


        compareButton.disabled =
          true;


        compareButton.textContent =
          "⏳ Jämför priser...";


        message.innerHTML =
          '<div class="loading">Hämtar aktuella priser...</div>';


        try {

          const allResults = [];


          for (
            const item of items
          ) {

            const products =
              await getProducts(
                item,
                postcode
              );


            allResults.push({

              item,

              products

            });
          }


          const matchedCount =
            allResults.filter(
              result =>
                chooseBestProduct(
                  result.item,
                  result.products
                )
            ).length;


          summary.innerHTML = `

            <div class="summary">

              <div class="summary-title">
                DIN KORG
              </div>

              <div class="summary-price">
                ${matchedCount}
                av
                ${items.length}
              </div>

              <div>
                varor kunde matchas mot prisdata
              </div>

            </div>

          `;


          cheapestResults.innerHTML =
            allResults
              .map(
                result =>
                  createItemHtml(
                    result.item,
                    result.products
                  )
              )
              .join("");


          renderOneStore(
            allResults
          );


          renderSmart(
            allResults
          );


          message.innerHTML = "";

          results.classList.remove(
            "hidden"
          );


        } catch (error) {

          console.error(error);


          message.innerHTML = `

            <div class="error">

              Något gick fel när priserna
              skulle hämtas.

              <br><br>

              ${escapeHtml(
                error.message
              )}

            </div>

          `;

        } finally {

          compareButton.disabled =
            false;

          compareButton.textContent =
            "🔎 Jämför min korg";
        }

      }
    );

  </script></body>
</html>
