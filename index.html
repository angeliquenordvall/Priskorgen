<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priskorgen</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f6f7;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 140px;
  padding: 15px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 12px;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.mode {
  background: white;
  padding: 16px;
  margin-top: 15px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.total {
  font-size: 24px;
  font-weight: bold;
  margin: 10px 0;
}

.small {
  color: #666;
  font-size: 14px;
}

.store {
  margin-top: 10px;
  padding: 10px;
  background: #f1f1f1;
  border-radius: 8px;
}

.product {
  padding: 12px 0;
  border-bottom: 1px solid #ddd;
}

.product:last-child {
  border-bottom: none;
}

.product-name {
  font-weight: bold;
  margin-bottom: 6px;
}

.price {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
}

.error {
  margin-top: 15px;
  padding: 12px;
  background: #ffe5e5;
  color: #a00000;
  border-radius: 10px;
}

.loading {
  margin-top: 15px;
  padding: 15px;
  background: white;
  border-radius: 12px;
  text-align: center;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 Priskorgen</h1>

<div class="subtitle">
Skriv din inköpslista och jämför riktiga priser
</div>

<textarea
  id="shoppingList"
  placeholder="mjölk
ägg
kaffe
bananer
köttfärs"></textarea>

<button onclick="compareBasket()">
🔎 Jämför min korg
</button>

<div id="error"></div>

<div id="loading" class="loading hidden">
Hämtar riktiga priser...
</div>

<div id="results">

<div class="mode">
<h2>🏪 En butik</h2>
<div id="oneStore">
<div class="small">
Vi hämtar riktiga priser från Primat.
</div>
</div>
</div>

<div class="mode">
<h2>✨ Billigast möjligt</h2>
<div id="cheapest">
<div class="small">
Priserna visas när du jämför din korg.
</div>
</div>
</div>

<div class="mode">
<h2>🚗 Smartast</h2>
<div id="smart">
<div class="small">
Smartast byggs ovanpå de riktiga priserna.
</div>
</div>
</div>

</div>

</div>

<script>

function money(value) {

  if (typeof value !== "number") {
    value = parseFloat(value);
  }

  if (isNaN(value)) {
    return "Pris saknas";
  }

  return value.toFixed(2).replace(".", ",") + " kr";
}


async function searchProduct(query) {

  const response = await fetch(
    "/api/primat?q=" +
    encodeURIComponent(query)
  );

  if (!response.ok) {

    throw new Error(
      "Kunde inte hämta " + query
    );

  }

  return await response.json();
}


function getProductsFromData(data) {

  if (Array.isArray(data)) {
    return data;
  }

  if (Array.isArray(data.products)) {
    return data.products;
  }

  if (Array.isArray(data.results)) {
    return data.results;
  }

  return [];
}


function getProductName(product) {

  return (
    product.name ||
    product.product_name ||
    product.title ||
    "Okänd produkt"
  );
}


function getStoreName(product) {

  return (
    product.store_name ||
    product.store ||
    product.chain ||
    product.retailer ||
    "Butik"
  );
}


function getPrice(product) {

  const possiblePrices = [

    product.effective,

    product.member,

    product.price,

    product.regular,

    product.comparison

  ];

  for (const price of possiblePrices) {

    if (
      typeof price === "number" &&
      !isNaN(price)
    ) {
      return price;
    }

    if (
      typeof price === "string" &&
      price.trim() !== ""
    ) {

      const number =
        parseFloat(
          price.replace(",", ".")
        );

      if (!isNaN(number)) {
        return number;
      }

    }

  }

  return null;
}


async function compareBasket() {

  const input =
    document.getElementById(
      "shoppingList"
    ).value;

  const items =
    input
      .split("\n")
      .map(x => x.trim())
      .filter(x => x.length > 0);

  const error =
    document.getElementById("error");

  const loading =
    document.getElementById("loading");

  if (items.length === 0) {

    error.innerHTML =
      "Skriv minst en vara.";

    return;
  }

  error.innerHTML = "";

  loading.classList.remove("hidden");

  document.getElementById("oneStore").innerHTML = "";
  document.getElementById("cheapest").innerHTML = "";
  document.getElementById("smart").innerHTML = "";

  try {

    const allResults = [];

    for (const item of items) {

      const data =
        await searchProduct(item);

      const products =
        getProductsFromData(data);

      allResults.push({
        query: item,
        products: products
      });

    }

    showRealResults(allResults);

  } catch (errorObject) {

    error.innerHTML =
      "Något gick fel: " +
      errorObject.message;

  }

  loading.classList.add("hidden");
}


function showRealResults(allResults) {

  let html = "";

  let totalProducts = 0;

  allResults.forEach(result => {

    html +=
      "<div class='product'>";

    html +=
      "<div class='product-name'>" +
      "🔎 " +
      result.query +
      "</div>";

    if (
      result.products.length === 0
    ) {

      html +=
        "<div class='small'>" +
        "Ingen produkt hittades." +
        "</div>";

    } else {

      const products =
        result.products.slice(0, 10);

      products.forEach(product => {

        const name =
          getProductName(product);

        const store =
          getStoreName(product);

        const price =
          getPrice(product);

        html +=

          "<div class='price'>" +

          "<span>" +
          name +
          "<br>" +
          "<span class='small'>" +
          store +
          "</span>" +
          "</span>" +

          "<strong>" +
          (
            price !== null
              ? money(price)
              : "Pris saknas"
          ) +
          "</strong>" +

          "</div>";

        totalProducts++;

      });

    }

    html +=
      "</div>";

  });


  document.getElementById(
    "cheapest"
  ).innerHTML =

    "<div class='small'>" +
    "Riktiga sökresultat från Primat." +
    "</div>" +

    "<div class='store'>" +
    html +
    "</div>";


  document.getElementById(
    "oneStore"
  ).innerHTML =

    "<div class='small'>" +
    "Vi har nu kopplat Priskorgen till " +
    "riktig prisdata. Nästa steg är att " +
    "samla priserna per butik och räkna " +
    "ut billigaste hela korgen." +
    "</div>";


  document.getElementById(
    "smart"
  ).innerHTML =

    "<div class='small'>" +
    "🚗 Smartast kommer att använda " +
    "de riktiga butikspriserna när " +
    "butikskopplingen är klar." +
    "</div>";
}

</script>

</body>
</html>
