<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrisKorgen</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #18202a;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

.header {
  background: white;
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}

.logo {
  font-size: 29px;
  font-weight: 800;
}

.subtitle {
  color: #687384;
  margin: 6px 0 20px;
}

textarea {
  width: 100%;
  min-height: 125px;
  border: 1px solid #d7dce3;
  border-radius: 15px;
  padding: 14px;
  font-size: 16px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 13px;
  padding: 13px 15px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.main-button {
  width: 100%;
  margin-top: 12px;
  background: #18202a;
  color: white;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,.05);
}

.modes {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.mode {
  background: #eef1f5;
  text-align: center;
  padding: 12px 7px;
}

.mode.active {
  background: #18202a;
  color: white;
}

.mode-title {
  font-size: 14px;
}

.mode-price {
  font-size: 22px;
  font-weight: 800;
  margin-top: 5px;
}

.saving {
  background: #edf8f0;
  border-radius: 11px;
  padding: 10px;
  margin-top: 10px;
  color: #2d6840;
}

.store {
  border: 1px solid #e0e3e8;
  border-radius: 14px;
  padding: 13px;
  margin-top: 9px;
}

.store-name {
  font-weight: 800;
}

.price {
  font-size: 22px;
  font-weight: 800;
  margin-top: 4px;
}

.member {
  color: #39734a;
  font-size: 14px;
  margin-top: 4px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.small {
  color: #687384;
  font-size: 13px;
}

.tag {
  display: inline-block;
  background: #eef1f5;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  margin-top: 6px;
}

@media(max-width:520px) {
  .modes {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">🛒 PrisKorgen</div>

<div class="subtitle">
Hitta det smartaste sättet att handla din korg.
</div>

<textarea id="shoppingList" placeholder="Skriv din inköpslista...

mjölk
ägg
kaffe
bananer
köttfärs"></textarea>

<button class="main-button" onclick="compareBasket()">
Jämför min korg
</button>

</div>

<div id="results"></div>

</div>
