<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priskorgen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 14px 50px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #666;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary-button {
      background: #287a35;
    }

    h2 {
      font-size: 22px;
      margin: 0 0 14px;
    }

    h3 {
      font-size: 18px;
      margin: 0;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .item-meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    /* PRODUKTVAL */

    .product-choice {
      margin-top: 10px;
    }

    .product-count {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .product-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .filter-button {
      width: auto;
      margin: 0;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: bold;
      background: #f0f1f3;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 20px;
    }

    .filter-button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-card {
      width: 100%;
      margin: 0;
      padding: 12px 13px;
      text-align: left;
      background: white;
      color: #222;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-weight: normal;
      cursor: pointer;
    }

    .product-card:hover {
      border-color: #999;
    }

    .product-card.selected {
      border: 2px solid #287a35;
      background: #eef8ef;
      padding: 11px 12px;
    }

    .product-card-name {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .product-card-meta {
      color: #777;
      font-size: 13px;
      line-height: 1.35;
    }

    .product-card-price {
      font-size: 15px;
      font-weight: bold;
      margin-top: 6px;
    }

    .selected-label {
      color: #287a35;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
    }

    .show-more-button {
      background: #f0f1f3;
      color: #222;
      margin-top: 8px;
      padding: 11px;
      font-size: 14px;
    }

    .choice-help {
      color: #777;
      font-size: 13px;
      margin-top: 9px;
    }

    .store-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .store-name {
      font-weight: 500;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
    }

    .cheapest {
      background: #eef8ef;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }

    .best-label {
      font-size: 13px;
      color: #287a35;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .smart {
      background: #f1f5ff;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .smart-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .error {
      background: #fff0f0;
      color: #a40000;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    .attribution {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }

    .attribution a {
      color: inherit;
    }

    .hidden {
      display: none;
    }

    .summary {
      background: #111;
      color: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .summary-title {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .summary-price {
      font-size: 28px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .container {
        padding: 16px 10px 40px;
      }

      .box {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛒 Priskorgen</h1>

  <p class="subtitle">
    Hitta billigaste sättet att handla din korg.
  </p>

  <div class="box">

    <label for="postcode">📍 Postnummer</label>

    <input
      id="postcode"
      type="text"
      value="89132"
      maxlength="5"
      inputmode="numeric"
    >

    <br><br>

    <label for="shoppingList">🛍️ Din inköpslista</label>

    <textarea
      id="shoppingList"
      placeholder="Skriv en vara per rad, till exempel:
Mjölk
Bananer
Kaffe
Smör
Bröd"
    ></textarea>

    <button id="findProductsButton">
      🔎 Hitta produkter
    </button>

    <div id="message"></div>

  </div>


  <!-- PRODUKTVAL -->

  <div id="selectionBox" class="box hidden">

    <h2>🛍️ Välj dina produkter</h2>

    <p style="color:#666; margin-top:-5px;">
      Välj exakt vilken produkt du vill jämföra.
    </p>

    <div id="productSelections"></div>

    <button
      id="compareSelectedButton"
      class="secondary-button"
    >
      💰 Jämför valda produkter
    </button>

  </div>


  <!-- RESULTAT -->

  <div id="results" class="hidden">

    <div id="summary"></div>

    <div class="box">

      <h2>✨ Billigast möjligt</h2>

      <div id="cheapestResults"></div>

    </div>


    <div class="box">

      <h2>🏪 En butik</h2>

      <div id="oneStoreResults"></div>

    </div>


    <div class="box">

      <h2>🚗 Smartast</h2>

      <div class="smart">

        <div class="smart-title">
          Smartaste alternativet
        </div>

        <div id="smartResults">
          Vi räknar på pris och antal butiker.
        </div>

      </div>

    </div>

  </div>


  <div class="attribution">

    Prisdata från

    <a
      href="https://primat.nu"
      target="_blank"
      rel="noopener"
    >
      primat.nu
    </a>

  </div>

</div>


<script>

  const findProductsButton =
    document.getElementById("findProductsButton");

  const compareSelectedButton =
    document.getElementById("compareSelectedButton");

  const postcodeInput =
    document.getElementById("postcode");

  const shoppingList =
    document.getElementById("shoppingList");

  const selectionBox =
    document.getElementById("selectionBox");

  const productSelections =
    document.getElementById("productSelections");

  const results =
    document.getElementById("results");

  const summary =
    document.getElementById("summary");

  const cheapestResults =
    document.getElementById("cheapestResults");

  const oneStoreResults =
    document.getElementById("oneStoreResults");

  const smartResults =
    document.getElementById("smartResults");

  const message =
    document.getElementById("message");


  const storeNames = {

    coop: "Coop",
    ica: "ICA",
    lidl: "Lidl",
    willys: "Willys",
    hemkop: "Hemköp"

  };


  let allResults = [];


  const INITIAL_PRODUCTS_TO_SHOW = 8;

  const PRODUCTS_TO_ADD = 12;


  function formatPrice(price) {

    if (
      price === null ||
      price === undefined
    ) {
      return "–";
    }

    return Number(price)
      .toFixed(2)
      .replace(".", ",") + " kr";

  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getStoreName(product) {

    return storeNames[product.chain]
      || product.chain
      || "Okänd butik";

  }


  function normalizeText(text) {

    return String(text)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9åäö\s]/gi, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  function singularizeWord(word) {

    if (
      word.length > 5 &&
      word.endsWith("or")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("ar")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("er")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("en")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("et")
    ) {
      return word.slice(0, -2);
    }

    return word;

  }


  function getSearchTerms(item) {

    return normalizeText(item)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function productText(product) {

    return normalizeText(
      [
        product.name || "",
        product.brand || "",
        product.category || "",
        product.package || ""
      ].join(" ")
    );

  }


  function getProductWords(product) {

    return productText(product)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function categoryText(product) {

    return normalizeText(
      product.category || ""
    );

  }


  /*
   * PRODUKTRELEVANS
   */

  function scoreProduct(item, product) {

    if (
      !product ||
      product.available === false
    ) {
      return -Infinity;
    }

    const query =
      normalizeText(item);

    const queryWords =
      getSearchTerms(item);

    const name =
      normalizeText(product.name || "");

    const brand =
      normalizeText(product.brand || "");

    const category =
      categoryText(product);

    const fullText =
      productText(product);

    const productWords =
      getProductWords(product);


    let score = 0;


    if (name === query) {
      score += 1000;
    }


    if (
      query &&
      name.startsWith(query)
    ) {
      score += 300;
    }


    if (
      query &&
      productWords.includes(query)
    ) {
      score += 250;
    }


    if (
      query &&
      name.includes(query)
    ) {
      score += 150;
    }


    for (
      const word of queryWords
    ) {

      if (!word) {
        continue;
      }


      if (
        productWords.includes(word)
      ) {
        score += 100;
      }


      if (
        category
          .split(" ")
          .map(singularizeWord)
          .includes(word)
      ) {
        score += 60;
      }


      if (
        brand === word
      ) {
        score += 30;
      }


      if (
        fullText.includes(word)
      ) {
        score += 20;
      }

    }


    if (
      queryWords.length > 1 &&
      queryWords.every(
        word => fullText.includes(word)
      )
    ) {
      score += 200;
    }


    if (
      query &&
      name === query
    ) {
      score += 500;
    }


    return score;

  }


  /*
   * EXTRA SÖKVARIANTER
   *
   * Primat gör själva sökningen.
   */

  function getQueryVariants(item) {

    const normalized =
      normalizeText(item);

    const variants = [item];


    if (normalized === "kaffe") {

      variants.push(
        "bryggkaffe",
        "malet kaffe",
        "kokkaffe",
        "kaffebönor",
        "kaffekapslar",
        "kaffefilter"
      );

    }


    if (normalized === "smor") {

      variants.push(
        "smör normalsaltat",
        "smör extrasaltat",
        "smör osaltat"
      );

    }


    if (normalized === "mjolk") {

      variants.push(
        "mjölk",
        "standardmjölk",
        "mellanmjölk",
        "lättmjölk"
      );

    }


    if (normalized === "brod") {

      variants.push(
        "bröd",
        "rostbröd",
        "formfranska",
        "limpa"
      );

    }


    return [
      ...new Set(variants)
    ];

  }


  async function getProducts(
    query,
    postcode
  ) {

    const variants =
      getQueryVariants(query);


    const responses =
      await Promise.all(

        variants.map(
          async variant => {

            const url =
              "/api/primat?q=" +
              encodeURIComponent(variant) +
              "&postcode=" +
              encodeURIComponent(postcode);


            const response =
              await fetch(url);


            if (!response.ok) {

              throw new Error(
                "Kunde inte hämta prisdata för " +
                variant
              );

            }


            const data =
              await response.json();


            if (
              !data.products ||
              !data.products.data
            ) {
              return [];
            }


            return data.products.data;

          }
        )

      );


    const productMap =
      new Map();


    for (
      const products of responses
    ) {

      for (
        const product of products
      ) {

        if (!product) {
          continue;
        }


        const key =
          product.gtin
            ? "gtin:" + product.gtin
            : [
                normalizeText(
                  product.name || ""
                ),
                normalizeText(
                  product.brand || ""
                ),
                normalizeText(
                  product.package || ""
                ),
                product.amount || "",
                product.unit || ""
              ].join("|");


        if (
          !productMap.has(key)
        ) {

          productMap.set(
            key,
            product
          );

        }

      }

    }


    return Array.from(
      productMap.values()
    );

  }


  function getProductKey(product) {

    if (product.gtin) {
      return "gtin:" + product.gtin;
    }


    return [

      normalizeText(product.name || ""),

      normalizeText(product.brand || ""),

      normalizeText(
        product.package ||
        (
          product.amount
            ? product.amount +
              " " +
              (product.unit || "")
            : ""
        )
      )

    ].join("|");

  }


  /*
   * -------------------------------------------------------
   * PRODUKTKATEGORIER
   * -------------------------------------------------------
   *
   * Viktigt:
   *
   * Vi klassificerar mer specifika produkter först.
   * Därför hamnar exempelvis:
   *
   * Kaffefilter → Filter
   * Kaffekapslar → Kapslar
   *
   * även om produktnamnet innehåller ord som kaffe.
   */


  function getProductGroup(product) {

    const text =
      productText(product);


    /*
     * 1. FILTER
     *
     * Måste komma först.
     */

    if (
      text.includes("kaffefilter") ||
      text.includes("kaffe filter") ||
      text.includes("filter kaffe") ||
      text.includes("filter 102") ||
      text.includes("filter 1x4") ||
      text.includes("kaffefilter")
    ) {

      return "Filter";

    }


    /*
     * 2. KAPSLAR
     */

    if (
      text.includes("kaffekaps") ||
      text.includes("kaffe kaps") ||
      text.includes("kapslar") ||
      text.includes("kapsel") ||
      text.includes("capsule")
    ) {

      return "Kapslar";

    }


    /*
     * 3. BRYGGKAFFE
     */

    if (
      text.includes("bryggkaffe") ||
      text.includes("brygg kaffe")
    ) {

      return "Bryggkaffe";

    }


    /*
     * 4. KOKKAFFE
     */

    if (
      text.includes("kokkaffe") ||
      text.includes("kok kaffe")
    ) {

      return "Kokkaffe";

    }


    /*
     * 5. KAFFEBÖNOR
     */

    if (
      text.includes("kaffebön") ||
      text.includes("kaffe bon") ||
      text.includes("espressobön") ||
      text.includes("espresso bon") ||
      text.includes("coffee beans")
    ) {

      return "Kaffebönor";

    }


    /*
     * 6. MALET KAFFE
     */

    if (
      text.includes("malet kaffe") ||
      text.includes("maletkaffe") ||
      text.includes("ground coffee") ||
      text.includes("groundcoffee")
    ) {

      return "Malet kaffe";

    }


    /*
     * 7. ÖVRIGT
     */

    return "Övrigt";

  }


  function getAvailableGroups(
    item,
    choices
  ) {

    const normalized =
      normalizeText(item);


    /*
     * Kategorifilter visas just nu
     * för kaffe eftersom det är där
     * vi har många olika typer.
     */

    if (
      normalized !== "kaffe"
    ) {

      return [];

    }


    const groups =
      new Set();


    choices.forEach(
      product => {

        const group =
          getProductGroup(
            product
          );

        groups.add(group);

      }
    );


    /*
     * Bestämd ordning.
     *
     * Vi lägger inte "Övrigt" först.
     */

    const preferredOrder = [

      "Bryggkaffe",
      "Kokkaffe",
      "Kaffebönor",
      "Kapslar",
      "Filter",
      "Malet kaffe",
      "Övrigt"

    ];


    return preferredOrder.filter(
      group => groups.has(group)
    );

  }


  function getProductChoices(
    item,
    products
  ) {

    const candidates =
      products
        .filter(product => {

          return product &&
            product.available !== false;

        })
        .map(product => {

          return {

            product,

            score:
              scoreProduct(
                item,
                product
              )

          };

        });


    candidates.sort(
      (a, b) => {

        if (
          b.score !== a.score
        ) {

          return b.score - a.score;

        }


        const aPrice =
          typeof a.product.prices?.effective === "number"
            ? a.product.prices.effective
            : Infinity;


        const bPrice =
          typeof b.product.prices?.effective === "number"
            ? b.product.prices.effective
            : Infinity;


        return aPrice - bPrice;

      }
    );


    const unique = [];

    const seen =
      new Set();


    for (
      const entry of candidates
    ) {

      const key =
        getProductKey(
          entry.product
        );


      if (
        seen.has(key)
      ) {

        continue;

      }


      seen.add(key);

      unique.push(
        entry.product
      );


      if (
        unique.length >= 100
      ) {

        break;

      }

    }


    return unique;

  }


  /*
   * PRODUKTKORT
   */

  function createProductCard(
    result,
    product,
    index,
    selectedProduct
  ) {

    const card =
      document.createElement("button");


    card.type = "button";


    card.className =
      "product-card";


    const isSelected =
      selectedProduct &&
      getProductKey(selectedProduct) ===
      getProductKey(product);


    if (isSelected) {

      card.classList.add(
        "selected"
      );

    }


    const name =
      document.createElement("div");


    name.className =
      "product-card-name";


    name.textContent =
      product.name ||
      "Okänd produkt";


    card.appendChild(
      name
    );


    const meta =
      document.createElement("div");


    meta.className =
      "product-card-meta";


    const metaParts = [];


    if (product.brand) {

      metaParts.push(
        product.brand
      );

    }


    const packageText =
      product.package ||
      (
        product.amount
          ? product.amount +
            " " +
            (product.unit || "")
          : ""
      );


    if (packageText) {

      metaParts.push(
        packageText
      );

    }


    meta.textContent =
      metaParts.join(" • ");


    card.appendChild(
      meta
    );


    const price =
      document.createElement("div");


    price.className =
      "product-card-price";


    if (
      typeof product.prices?.effective === "number"
    ) {

      price.textContent =
        formatPrice(
          product.prices.effective
        ) +
        " från";

    } else {

      price.textContent =
        "Pris saknas";

    }


    card.appendChild(
      price
    );


    if (isSelected) {

      const selectedLabel =
        document.createElement("div");


      selectedLabel.className =
        "selected-label";


      selectedLabel.textContent =
        "✓ VALD PRODUKT";


      card.appendChild(
        selectedLabel
      );

    }


    card.addEventListener(
      "click",
      function() {

        result.selectedProduct =
          product;

        renderProductSelections();

      }
    );


    return card;

  }


  /*
   * RENDER PRODUKTVÄLJARE
   */

  function renderProductSelections() {

    productSelections.innerHTML =
      "";


    allResults.forEach(
      (result, index) => {

        const choices =
          getProductChoices(
            result.item,
            result.products
          );


        const wrapper =
          document.createElement("div");


        wrapper.className =
          "item";


        const title =
          document.createElement("div");


        title.className =
          "item-name";


        title.textContent =
          result.item;


        wrapper.appendChild(
          title
        );


        if (
          !choices.length
        ) {

          const empty =
            document.createElement("div");


          empty.className =
            "empty";


          empty.textContent =
            "Ingen produkt hittades.";


          wrapper.appendChild(
            empty
          );


          result.choices = [];

          result.selectedProduct =
            null;


          productSelections.appendChild(
            wrapper
          );


          return;

        }


        result.choices =
          choices;


        if (
          !result.selectedProduct
        ) {

          result.selectedProduct =
            null;

        }


        const choiceBox =
          document.createElement("div");


        choiceBox.className =
          "product-choice";


        const count =
          document.createElement("div");


        count.className =
          "product-count";


        count.textContent =
          choices.length +
          " möjliga produkter hittades.";


        choiceBox.appendChild(
          count
        );


        /*
         * FILTER
         */

        const groups =
          getAvailableGroups(
            result.item,
            choices
          );


        let activeGroup =
          result.activeGroup ||
          "Alla";


        const filters =
          document.createElement("div");


        filters.className =
          "product-filters";


        if (
          groups.length > 0
        ) {

          /*
           * ALLA
           */

          const allButton =
            document.createElement("button");


          allButton.type = "button";


          allButton.className =
            "filter-button";


          if (
            activeGroup === "Alla"
          ) {

            allButton.classList.add(
              "active"
            );

          }


          allButton.textContent =
            "Alla";


          allButton.addEventListener(
            "click",
            function() {

              result.activeGroup =
                "Alla";


              result.visibleCount =
                INITIAL_PRODUCTS_TO_SHOW;


              renderProductSelections();

            }
          );


          filters.appendChild(
            allButton
          );


          /*
           * KATEGORIER
           */

          groups.forEach(
            group => {

              const filterButton =
                document.createElement("button");


              filterButton.type = "button";


              filterButton.className =
                "filter-button";


              if (
                activeGroup === group
              ) {

                filterButton.classList.add(
                  "active"
                );

              }


              filterButton.textContent =
                group;


              filterButton.addEventListener(
                "click",
                function() {

                  result.activeGroup =
                    group;


                  result.visibleCount =
                    INITIAL_PRODUCTS_TO_SHOW;


                  renderProductSelections();

                }
              );


              filters.appendChild(
                filterButton
              );

            }
          );


          choiceBox.appendChild(
            filters
          );

        }


        /*
         * FILTRERA ENDAST FÖR VISNING
         */

        let visibleChoices =
          choices;


        if (
          activeGroup !== "Alla"
        ) {

          visibleChoices =
            choices.filter(
              product =>
                getProductGroup(product) ===
                activeGroup
            );

        }


        const visibleCount =
          result.visibleCount ||
          INITIAL_PRODUCTS_TO_SHOW;


        const productsToRender =
          visibleChoices.slice(
            0,
            visibleCount
          );


        const productList =
          document.createElement("div");


        productList.className =
          "product-list";


        productsToRender.forEach(
          product => {

            productList.appendChild(
              createProductCard(
                result,
                product,
                index,
                result.selectedProduct
              )
            );

          }
        );


        choiceBox.appendChild(
          productList
        );


        /*
         * VISA FLER
         */

        if (
          visibleChoices.length >
          visibleCount
        ) {

          const showMore =
            document.createElement("button");


          showMore.type = "button";


          showMore.className =
            "show-more-button";


          showMore.textContent =
            "Visa fler produkter (" +
            (
              visibleChoices.length -
              visibleCount
            ) +
            " kvar)";


          showMore.addEventListener(
            "click",
            function() {

              result.visibleCount =
                visibleCount +
                PRODUCTS_TO_ADD;


              renderProductSelections();

            }
          );


          choiceBox.appendChild(
            showMore
          );

        }


        const help =
          document.createElement("div");


        help.className =
          "choice-help";


        if (
          result.selectedProduct
        ) {

          help.textContent =
            "✓ Produkten är vald. Du kan ändra valet ovan.";

        } else {

          help.textContent =
            "Tryck på en produkt för att välja den.";

        }


        choiceBox.appendChild(
          help
        );


        wrapper.appendChild(
          choiceBox
        );


        productSelections.appendChild(
          wrapper
        );

      }
    );

  }


  function getSelectedProducts() {

    const selectedResults = [];


    allResults.forEach(
      result => {

        if (
          !result.selectedProduct
        ) {

          return;

        }


        selectedResults.push({

          item:
            result.item,

          selectedProduct:
            result.selectedProduct,

          products:
            result.products

        });

      }
    );


    return selectedResults;

  }


  function getSameProductPrices(
    selectedProduct,
    products
  ) {

    const selectedKey =
      getProductKey(
        selectedProduct
      );


    const matches =
      products.filter(product => {

        if (
          !product ||
          product.available === false ||
          !product.prices ||
          typeof product.prices.effective !== "number"
        ) {

          return false;

        }


        return (
          getProductKey(product) ===
          selectedKey
        );

      });


    const byStore = {};


    matches.forEach(
      product => {

        const key =
          product.chain +
          ":" +
          product.store_id;


        if (!byStore[key]) {

          byStore[key] =
            product;

        }

      }
    );


    return Object.values(
      byStore
    );

  }


  function createItemHtml(
    result
  ) {

    const selected =
      result.selectedProduct;


    const matches =
      getSameProductPrices(
        selected,
        result.products
      );


    matches.sort(
      (a, b) =>
        a.prices.effective -
        b.prices.effective
    );


    if (
      !matches.length
    ) {

      return `

        <div class="item">

          <div class="item-name">
            ${escapeHtml(
              selected.name
            )}
          </div>

          <div class="empty">
            Ingen butik med denna exakta
            produkt hittades i prisdatan.
          </div>

        </div>

      `;

    }


    const cheapest =
      matches[0];


    const packageText =
      selected.package ||
      (
        selected.amount
          ? selected.amount +
            " " +
            (selected.unit || "")
          : ""
      );


    return `

      <div class="item">

        <div class="item-name">
          ${escapeHtml(
            selected.name
          )}
        </div>

        <div class="item-meta">

          ${escapeHtml(
            selected.brand || ""
          )}

          ${
            packageText
              ? " • " +
                escapeHtml(
                  packageText
                )
              : ""
          }

        </div>


        <div class="cheapest">

          <div class="best-label">
            BILLIGAST
          </div>

          <div class="store-row">

            <span class="store-name">

              ${escapeHtml(
                getStoreName(
                  cheapest
                )
              )}

            </span>

            <span class="price">

              ${formatPrice(
                cheapest.prices.effective
              )}

            </span>

          </div>

        </div>


        <div style="margin-top:10px;">

          ${
            matches.map(
              product => `

                <div class="store-row">

                  <span class="store-name">

                    ${escapeHtml(
                      getStoreName(
                        product
                      )
                    )}

                  </span>

                  <span class="price">

                    ${formatPrice(
                      product.prices.effective
                    )}

                  </span>

                </div>

              `
            ).join("")
          }

        </div>

      </div>

    `;

  }


  function calculateStoreTotals(
    selectedResults
  ) {

    const totals = {};


    for (
      const result of selectedResults
    ) {

      const matches =
        getSameProductPrices(
          result.selectedProduct,
          result.products
        );


      matches.forEach(
        product => {

          const storeKey =
            product.chain +
            ":" +
            product.store_id;


          if (!totals[storeKey]) {

            totals[storeKey] = {

              chain:
                product.chain,

              store_id:
                product.store_id,

              name:
                getStoreName(
                  product
                ),

              total:
                0,

              items:
                0

            };

          }


          totals[storeKey].total +=
            product.prices.effective;


          totals[storeKey].items +=
            1;

        }
      );

    }


    return Object.values(
      totals
    );

  }


  function renderOneStore(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults
      );


    if (
      !totals.length
    ) {

      oneStoreResults.innerHTML =
        '<div class="empty">Ingen butik kunde räknas fram.</div>';

      return;

    }


    totals.sort(
      (a, b) => {

        if (
          b.items !== a.items
        ) {

          return b.items - a.items;

        }


        return (
          a.total -
          b.total
        );

      }
    );


    const best =
      totals[0];


    oneStoreResults.innerHTML = `

      <div class="item">

        <div class="item-name">

          🏆 ${escapeHtml(
            best.name
          )}

        </div>


        <div class="item-meta">

          ${best.items} av
          ${selectedResults.length}
          valda produkter finns i denna butik.

        </div>


        <div class="cheapest">

          <div class="best-label">
            TOTAL FÖR TILLGÄNGLIGA PRODUKTER
          </div>


          <div class="store-row">

            <span class="store-name">

              ${escapeHtml(
                best.name
              )}

            </span>


            <span class="price">

              ${formatPrice(
                best.total
              )}

            </span>

          </div>

        </div>

      </div>

    `;

  }


  function renderSmart(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults
      );


    if (
      !totals.length
    ) {

      smartResults.innerHTML =
        "Vi hittade inte tillräckligt med data ännu.";

      return;

    }


    totals.sort(
      (a, b) => {

        if (
          b.items !== a.items
        ) {

          return b.items - a.items;

        }


        return (
          a.total -
          b.total
        );

      }
    );


    const best =
      totals[0];


    smartResults.innerHTML = `

      <strong>
        ${escapeHtml(
          best.name
        )}
      </strong>

      har just nu det bästa alternativet
      bland de butiker där vi hittar dina valda produkter.

      <br><br>

      ${best.items} av
      ${selectedResults.length}
      produkter:

      <strong>
        ${formatPrice(
          best.total
        )}
      </strong>

      <br><br>

      <small>

        🚗 Nästa steg blir att väga in avstånd,
        restid och hur mycket du faktiskt sparar
        på att åka till flera butiker.

      </small>

    `;

  }


  /*
   * STEG 1:
   *
   * HÄMTA PRODUKTER
   */

  findProductsButton.addEventListener(
    "click",
    async function() {

      const postcode =
        postcodeInput.value.trim();


      const items =
        shoppingList.value
          .split("\n")
          .map(
            item => item.trim()
          )
          .filter(
            item => item.length > 0
          );


      message.innerHTML = "";


      results.classList.add(
        "hidden"
      );


      selectionBox.classList.add(
        "hidden"
      );


      if (!postcode) {

        message.innerHTML =
          '<div class="error">Skriv in ditt postnummer.</div>';

        return;

      }


      if (
        !/^\d{5}$/.test(
          postcode
        )
      ) {

        message.innerHTML =
          '<div class="error">Postnumret måste innehålla 5 siffror.</div>';

        return;

      }


      if (!items.length) {

        message.innerHTML =
          '<div class="error">Skriv minst en vara i inköpslistan.</div>';

        return;

      }


      findProductsButton.disabled =
        true;


      findProductsButton.textContent =
        "⏳ Hittar produkter...";


      message.innerHTML =
        '<div class="loading">Hämtar produktalternativ...</div>';


      try {

        allResults = [];


        for (
          const item of items
        ) {

          const products =
            await getProducts(
              item,
              postcode
            );


          allResults.push({

            item,

            products,

            selectedProduct:
              null,

            visibleCount:
              INITIAL_PRODUCTS_TO_SHOW,

            activeGroup:
              "Alla"

          });

        }


        renderProductSelections();


        selectionBox.classList.remove(
          "hidden"
        );


        message.innerHTML =
          "";


        selectionBox.scrollIntoView({

          behavior: "smooth",

          block: "start"

        });


      } catch (error) {

        console.error(error);


        message.innerHTML = `

          <div class="error">

            Något gick fel när produkterna
            skulle hämtas.

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

      } finally {

        findProductsButton.disabled =
          false;


        findProductsButton.textContent =
          "🔎 Hitta produkter";

      }

    }
  );


  /*
   * STEG 2:
   *
   * JÄMFÖR EXAKT DE PRODUKTER
   * ANVÄNDAREN VALT.
   */

  compareSelectedButton.addEventListener(
    "click",
    function() {

      const selectedResults =
        getSelectedProducts();


      if (
        !selectedResults.length
      ) {

        message.innerHTML =
          '<div class="error">Välj minst en produkt först.</div>';

        return;

      }


      const matchedCount =
        selectedResults.filter(
          result => {

            return getSameProductPrices(
              result.selectedProduct,
              result.products
            ).length > 0;

          }
        ).length;


      summary.innerHTML = `

        <div class="summary">

          <div class="summary-title">
            DIN KORG
          </div>

          <div class="summary-price">

            ${matchedCount} av
            ${selectedResults.length}

          </div>

          <div>

            valda produkter kunde jämföras
            mellan butikerna

          </div>

        </div>

      `;


      cheapestResults.innerHTML =
        selectedResults
          .map(
            result =>
              createItemHtml(
                result
              )
          )
          .join("");


      renderOneStore(
        selectedResults
      );


      renderSmart(
        selectedResults
      );


      results.classList.remove(
        "hidden"
      );


      results.scrollIntoView({

        behavior: "smooth",

        block: "start"

      });

    }
  );

</script>
