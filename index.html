<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priskorgen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 14px 50px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #666;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary-button {
      background: #287a35;
    }

    h2 {
      font-size: 22px;
      margin: 0 0 14px;
    }

    h3 {
      font-size: 18px;
      margin: 0;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .item-meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .product-choice {
      background: #f7f8fa;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .product-choice label {
      font-size: 14px;
      margin-bottom: 7px;
    }

    .choice-help {
      color: #777;
      font-size: 13px;
      margin-top: 7px;
    }

    .store-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .store-name {
      font-weight: 500;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
    }

    .cheapest {
      background: #eef8ef;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }

    .best-label {
      font-size: 13px;
      color: #287a35;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .smart {
      background: #f1f5ff;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .smart-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .error {
      background: #fff0f0;
      color: #a40000;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    .attribution {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }

    .attribution a {
      color: inherit;
    }

    .hidden {
      display: none;
    }

    .summary {
      background: #111;
      color: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .summary-title {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .summary-price {
      font-size: 28px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .container {
        padding: 16px 10px 40px;
      }

      .box {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🛒 Priskorgen</h1>

  <p class="subtitle">
    Hitta billigaste sättet att handla din korg.
  </p>

  <div class="box">

    <label for="postcode">📍 Postnummer</label>

    <input
      id="postcode"
      type="text"
      value="89132"
      maxlength="5"
      inputmode="numeric"
    >

    <br><br>

    <label for="shoppingList">🛍️ Din inköpslista</label>

    <textarea
      id="shoppingList"
      placeholder="Skriv en vara per rad, till exempel:

Mjölk
Bananer
Kaffe
Smör
Bröd"
    ></textarea>

    <button id="findProductsButton">
      🔎 Hitta produkter
    </button>

    <div id="message"></div>

  </div>


  <!-- PRODUKTVAL -->

  <div id="selectionBox" class="box hidden">

    <h2>🛍️ Välj dina produkter</h2>

    <p style="color:#666; margin-top:-5px;">
      Välj exakt vilken produkt du vill jämföra.
    </p>

    <div id="productSelections"></div>

    <button
      id="compareSelectedButton"
      class="secondary-button"
    >
      💰 Jämför valda produkter
    </button>

  </div>


  <!-- RESULTAT -->

  <div id="results" class="hidden">

    <div id="summary"></div>

    <div class="box">

      <h2>✨ Billigast möjligt</h2>

      <div id="cheapestResults"></div>

    </div>


    <div class="box">

      <h2>🏪 En butik</h2>

      <div id="oneStoreResults"></div>

    </div>


    <div class="box">

      <h2>🚗 Smartast</h2>

      <div class="smart">

        <div class="smart-title">
          Smartaste alternativet
        </div>

        <div id="smartResults">
          Vi räknar på pris och antal butiker.
        </div>

      </div>

    </div>

  </div>


  <div class="attribution">

    Prisdata från

    <a
      href="https://primat.nu"
      target="_blank"
      rel="noopener"
    >
      primat.nu
    </a>

  </div>

</div>


<script>

  const findProductsButton =
    document.getElementById("findProductsButton");

  const compareSelectedButton =
    document.getElementById("compareSelectedButton");

  const postcodeInput =
    document.getElementById("postcode");

  const shoppingList =
    document.getElementById("shoppingList");

  const selectionBox =
    document.getElementById("selectionBox");

  const productSelections =
    document.getElementById("productSelections");

  const results =
    document.getElementById("results");

  const summary =
    document.getElementById("summary");

  const cheapestResults =
    document.getElementById("cheapestResults");

  const oneStoreResults =
    document.getElementById("oneStoreResults");

  const smartResults =
    document.getElementById("smartResults");

  const message =
    document.getElementById("message");


  const storeNames = {

    coop: "Coop",
    ica: "ICA",
    lidl: "Lidl",
    willys: "Willys",
    hemkop: "Hemköp"

  };


  /*
   * Här sparas alla produkter som hämtades
   * innan användaren gör sitt val.
   */

  let allResults = [];


  function formatPrice(price) {

    if (
      price === null ||
      price === undefined
    ) {
      return "–";
    }

    return Number(price)
      .toFixed(2)
      .replace(".", ",") + " kr";

  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getStoreName(product) {

    return storeNames[product.chain]
      || product.chain
      || "Okänd butik";

  }


  function normalizeText(text) {

    return String(text)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9åäö\s]/gi, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  function singularizeWord(word) {

    if (
      word.length > 5 &&
      word.endsWith("or")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("ar")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("er")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("en")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("et")
    ) {
      return word.slice(0, -2);
    }

    return word;

  }


  /*
   * Sökord som vi inte vill att ska styra
   * produktvalet.
   */

  const excludedWords = {

    mjolk: [
      "baby",
      "babys",
      "babysemp",
      "ersattning",
      "mjolkersattning",
      "havredryck",
      "mandeldryck",
      "sojadryck",
      "kokosdryck",
      "chokladmjolk",
      "kaffemjolk"
    ],

    smor: [
      "smordeg",
      "smorgas",
      "smorgasfett",
      "smorj",
      "margarin",
      "bregott",
      "rapsolja",
      "raps",
      "jordnotssmor",
      "jordnot",
      "mandelsmor",
      "kryddsmor",
      "vitlokssmor",
      "persiljesmor",
      "smorkniv",
      "smorkringla",
      "smorgasgurka",
      "smorgaspapper",
      "smorgasgrill",
      "smorgaskex",
      "smorgasran",
      "smordejsplattor",
      "smordejsplatta"
    ],

    kaffe: [
      "kaffefilter",
      "kaffemugg",
      "kaffemaskin",
      "kaffekvarn",
      "kaffeservis",
      "kaffekapsel",
      "kaffekapslar",
      "kapsel",
      "kapslar"
    ],

    brod: [
      "knackebrod",
      "skorpor",
      "brodmix",
      "brodpudding",
      "brodpinnar",
      "french",
      "twists",
      "breadsticks",
      "grissini"
    ]

  };


  function getSearchTerms(item) {

    return normalizeText(item)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function productText(product) {

    return normalizeText(

      [
        product.name || "",
        product.brand || "",
        product.category || "",
        product.package || ""
      ].join(" ")

    );

  }


  function getProductWords(product) {

    return productText(product)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function categoryText(product) {

    return normalizeText(
      product.category || ""
    );

  }


  function hasWholeWord(product, word) {

    if (!word) {
      return false;
    }

    return getProductWords(product)
      .includes(word);

  }


  function getConcept(item) {

    const text =
      normalizeText(item);

    if (
      text === "mjolk" ||
      text === "mjolken"
    ) {
      return "mjolk";
    }

    if (
      text === "smor" ||
      text === "smoret"
    ) {
      return "smor";
    }

    if (text === "kaffe") {
      return "kaffe";
    }

    if (
      text === "brod" ||
      text === "brodet"
    ) {
      return "brod";
    }

    if (
      text === "banan" ||
      text === "bananer"
    ) {
      return "banan";
    }

    return null;

  }


  function containsExcludedWord(
    product,
    exclusions
  ) {

    const words =
      getProductWords(product);

    return exclusions.some(
      excluded => words.includes(excluded)
    );

  }


  /*
   * Produktmatchning används nu främst för
   * att sortera produkterna i rullistan.
   *
   * Vi väljer alltså INTE längre automatiskt
   * vilken produkt användaren måste köpa.
   */

  function scoreProduct(item, product) {

    if (
      !product ||
      product.available === false ||
      !product.prices ||
      typeof product.prices.effective !== "number"
    ) {
      return -Infinity;
    }


    const query =
      normalizeText(item);

    const queryWords =
      getSearchTerms(item);

    const name =
      normalizeText(product.name || "");

    const category =
      categoryText(product);

    const brand =
      normalizeText(product.brand || "");

    const productWords =
      getProductWords(product);


    let score = 0;


    /*
     * Exakt namn.
     */

    if (name === query) {
      score += 150;
    }


    /*
     * Egna ord.
     */

    for (const word of queryWords) {

      if (!word) {
        continue;
      }

      if (
        productWords.includes(word)
      ) {
        score += 40;
      }

      if (
        category
          .split(" ")
          .map(singularizeWord)
          .includes(word)
      ) {
        score += 20;
      }

      if (brand === word) {
        score += 5;
      }

    }


    if (name.includes(query)) {
      score += 15;
    }


    if (name.startsWith(query)) {
      score += 10;
    }


    const concept =
      getConcept(item);


    /*
     * MJÖLK
     */

    if (concept === "mjolk") {

      if (
        hasWholeWord(product, "mjolk") &&
        !containsExcludedWord(
          product,
          excludedWords.mjolk
        )
      ) {
        score += 100;
      }

      if (
        category.includes("mjolk")
      ) {
        score += 35;
      }

      if (
        name.includes("standardmjolk") ||
        name.includes("mellanmjolk") ||
        name.includes("lattemjolk")
      ) {
        score += 25;
      }

    }


    /*
     * SMÖR
     */

    if (concept === "smor") {

      const excluded =
        containsExcludedWord(
          product,
          excludedWords.smor
        );

      if (excluded) {
        score -= 500;
      }

      if (
        hasWholeWord(product, "smor") &&
        !excluded
      ) {
        score += 110;
      }

      if (
        category.includes("smor") &&
        !excluded
      ) {
        score += 40;
      }

      if (
        name.includes("normalsaltat") ||
        name.includes("osaltat") ||
        name.includes("extrasaltat")
      ) {
        score += 30;
      }

      if (
        name.includes("80%") ||
        name.includes("81%") ||
        name.includes("82%")
      ) {
        score += 25;
      }

    }


    /*
     * BANAN
     */

    if (concept === "banan") {

      if (
        hasWholeWord(product, "banan")
      ) {
        score += 100;
      }

      if (
        category.includes("frukt") ||
        category.includes("banan")
      ) {
        score += 30;
      }

    }


    /*
     * KAFFE
     */

    if (concept === "kaffe") {

      const excluded =
        containsExcludedWord(
          product,
          excludedWords.kaffe
        );

      if (excluded) {
        score -= 500;
      }

      if (
        hasWholeWord(product, "kaffe") &&
        !excluded
      ) {
        score += 100;
      }

      if (
        category.includes("kaffe") &&
        !excluded
      ) {
        score += 40;
      }

      if (
        name.includes("bryggkaffe") ||
        name.includes("kaffebonor") ||
        name.includes("kaffebon") ||
        name.includes("mellanrost") ||
        name.includes("morkrost") ||
        name.includes("ljusrost")
      ) {
        score += 30;
      }

    }


    /*
     * BRÖD
     */

    if (concept === "brod") {

      const excluded =
        containsExcludedWord(
          product,
          excludedWords.brod
        );

      if (excluded) {
        score -= 500;
      }

      if (
        hasWholeWord(product, "brod") &&
        !excluded
      ) {
        score += 110;
      }

      if (
        category.includes("brod") &&
        !excluded
      ) {
        score += 40;
      }

    }


    /*
     * Generella exkluderingar.
     */

    const exclusions =
      excludedWords[concept] || [];


    if (
      containsExcludedWord(
        product,
        exclusions
      )
    ) {
      score -= 250;
    }


    /*
     * Ensamt sökord.
     */

    if (
      queryWords.length === 1
    ) {

      const word =
        queryWords[0];

      const exactWord =
        productWords.includes(word);

      const categoryMatch =
        category
          .split(" ")
          .map(singularizeWord)
          .includes(word);


      if (
        !exactWord &&
        !categoryMatch
      ) {
        score -= 100;
      }

    }


    return score;

  }


  async function getProducts(
    query,
    postcode
  ) {

    const url =
      "/api/primat?q=" +
      encodeURIComponent(query) +
      "&postcode=" +
      encodeURIComponent(postcode);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Kunde inte hämta prisdata för " +
        query
      );

    }


    const data =
      await response.json();


    if (
      !data.products ||
      !data.products.data
    ) {
      return [];
    }


    return data.products.data;

  }


  /*
   * Skapar en identifierare för produkten.
   *
   * GTIN är bäst.
   * Om GTIN saknas använder vi namn + varumärke +
   * förpackning som reserv.
   */

  function getProductKey(product) {

    if (product.gtin) {
      return "gtin:" + product.gtin;
    }


    return [

      normalizeText(product.name || ""),

      normalizeText(product.brand || ""),

      normalizeText(
        product.package ||
        (
          product.amount
            ? product.amount +
              " " +
              (product.unit || "")
            : ""
        )
      )

    ].join("|");

  }


  /*
   * Tar fram unika produktalternativ.
   *
   * Samma produkt kan finnas hos flera butiker.
   * Den ska bara visas en gång i rullistan.
   */

  function getProductChoices(
    item,
    products
  ) {

    const candidates =
      products
        .filter(product => {

          return product &&
            product.available !== false &&
            product.prices &&
            typeof product.prices.effective === "number";

        })
        .map(product => {

          return {

            product,

            score:
              scoreProduct(
                item,
                product
              )

          };

        })
        .filter(entry => entry.score > 0);


    candidates.sort((a, b) => {

      if (b.score !== a.score) {
        return b.score - a.score;
      }

      return (
        a.product.prices.effective -
        b.product.prices.effective
      );

    });


    const unique = [];
    const seen = new Set();


    for (const entry of candidates) {

      const key =
        getProductKey(entry.product);


      if (seen.has(key)) {
        continue;
      }


      seen.add(key);

      unique.push(entry.product);


      /*
       * Rullistan behöver inte bli enorm.
       */

      if (unique.length >= 20) {
        break;
      }

    }


    return unique;

  }


  /*
   * Visar produktvalen.
   */

  function renderProductSelections() {

    productSelections.innerHTML = "";


    allResults.forEach(
      (result, index) => {

        const choices =
          getProductChoices(
            result.item,
            result.products
          );


        const wrapper =
          document.createElement("div");

        wrapper.className = "item";


        const title =
          document.createElement("div");

        title.className = "item-name";

        title.textContent =
          result.item;


        wrapper.appendChild(title);


        if (!choices.length) {

          const empty =
            document.createElement("div");

          empty.className = "empty";

          empty.textContent =
            "Ingen relevant produkt hittades.";

          wrapper.appendChild(empty);


          result.choices = [];

          return;

        }


        result.choices =
          choices;


        const choiceBox =
          document.createElement("div");

        choiceBox.className =
          "product-choice";


        const label =
          document.createElement("label");

        label.textContent =
          "Välj produkt:";


        choiceBox.appendChild(label);


        const select =
          document.createElement("select");

        select.id =
          "product-select-" + index;


        choices.forEach(
          (product, choiceIndex) => {

            const option =
              document.createElement("option");

            option.value =
              String(choiceIndex);


            const packageText =
              product.package ||
              (
                product.amount
                  ? product.amount +
                    " " +
                    (product.unit || "")
                  : ""
              );


            const brand =
              product.brand
                ? product.brand + " • "
                : "";


            option.textContent =
              product.name +
              (
                brand
                  ? " — " + brand.trim()
                  : ""
              ) +
              (
                packageText
                  ? " • " + packageText
                  : ""
              );


            select.appendChild(option);

          }
        );


        choiceBox.appendChild(select);


        const help =
          document.createElement("div");

        help.className =
          "choice-help";

        help.textContent =
          choices.length +
          " relevanta produktalternativ hittades.";


        choiceBox.appendChild(help);


        wrapper.appendChild(choiceBox);


        productSelections.appendChild(wrapper);

      }
    );

  }


  /*
   * Hämtar de produkter användaren faktiskt
   * valde i rullistorna.
   */

  function getSelectedProducts() {

    const selectedResults = [];


    allResults.forEach(
      (result, index) => {

        const select =
          document.getElementById(
            "product-select-" + index
          );


        if (
          !select ||
          !result.choices ||
          !result.choices.length
        ) {
          return;
        }


        const choiceIndex =
          Number(select.value);


        const selected =
          result.choices[choiceIndex];


        if (!selected) {
          return;
        }


        selectedResults.push({

          item: result.item,

          selectedProduct: selected,

          products: result.products

        });

      }
    );


    return selectedResults;

  }


  /*
   * När användaren valt en produkt jämför vi
   * samma produktidentifierare mot butikerna.
   */

  function getSameProductPrices(
    selectedProduct,
    products
  ) {

    const selectedKey =
      getProductKey(selectedProduct);


    const matches =
      products.filter(product => {

        if (
          !product ||
          product.available === false ||
          !product.prices ||
          typeof product.prices.effective !== "number"
        ) {
          return false;
        }


        return (
          getProductKey(product) ===
          selectedKey
        );

      });


    /*
     * Samma butik ska inte visas flera gånger.
     */

    const byStore = {};


    matches.forEach(product => {

      const key =
        product.chain +
        ":" +
        product.store_id;


      if (!byStore[key]) {
        byStore[key] = product;
      }

    });


    return Object.values(byStore);

  }


  function createItemHtml(result) {

    const selected =
      result.selectedProduct;


    const matches =
      getSameProductPrices(
        selected,
        result.products
      );


    matches.sort(
      (a, b) =>
        a.prices.effective -
        b.prices.effective
    );


    if (!matches.length) {

      return `

        <div class="item">

          <div class="item-name">
            ${escapeHtml(selected.name)}
          </div>

          <div class="empty">
            Ingen butik med denna exakta produkt
            hittades i prisdatan.
          </div>

        </div>

      `;

    }


    const cheapest =
      matches[0];


    const packageText =
      selected.package ||
      (
        selected.amount
          ? selected.amount +
            " " +
            (selected.unit || "")
          : ""
      );


    return `

      <div class="item">

        <div class="item-name">
          ${escapeHtml(selected.name)}
        </div>

        <div class="item-meta">

          ${escapeHtml(
            selected.brand || ""
          )}

          ${
            packageText
              ? " • " +
                escapeHtml(packageText)
              : ""
          }

        </div>


        <div class="cheapest">

          <div class="best-label">
            BILLIGAST
          </div>

          <div class="store-row">

            <span class="store-name">
              ${escapeHtml(
                getStoreName(cheapest)
              )}
            </span>

            <span class="price">
              ${formatPrice(
                cheapest.prices.effective
              )}
            </span>

          </div>

        </div>


        <div style="margin-top:10px;">

          ${
            matches.map(product => `

              <div class="store-row">

                <span class="store-name">
                  ${escapeHtml(
                    getStoreName(product)
                  )}
                </span>

                <span class="price">
                  ${formatPrice(
                    product.prices.effective
                  )}
                </span>

              </div>

            `).join("")
          }

        </div>

      </div>

    `;

  }


  /*
   * Beräknar totalen per butik för de produkter
   * användaren faktiskt valt.
   */

  function calculateStoreTotals(
    selectedResults
  ) {

    const totals = {};


    for (
      const result of selectedResults
    ) {

      const matches =
        getSameProductPrices(
          result.selectedProduct,
          result.products
        );


      matches.forEach(product => {

        const storeKey =
          product.chain +
          ":" +
          product.store_id;


        if (!totals[storeKey]) {

          totals[storeKey] = {

            chain:
              product.chain,

            store_id:
              product.store_id,

            name:
              getStoreName(product),

            total: 0,

            items: 0

          };

        }


        totals[storeKey].total +=
          product.prices.effective;


        totals[storeKey].items += 1;

      });

    }


    return Object.values(totals);

  }


  function renderOneStore(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults
      );


    if (!totals.length) {

      oneStoreResults.innerHTML =
        '<div class="empty">Ingen butik kunde räknas fram.</div>';

      return;

    }


    /*
     * För En butik krävs egentligen att butiken
     * har alla valda produkter.
     *
     * Därför sorterar vi först på antal kompletta
     * produkter och sedan totalpris.
     */

    totals.sort((a, b) => {

      if (b.items !== a.items) {
        return b.items - a.items;
      }

      return a.total - b.total;

    });


    const best =
      totals[0];


    oneStoreResults.innerHTML = `

      <div class="item">

        <div class="item-name">
          🏆 ${escapeHtml(best.name)}
        </div>

        <div class="item-meta">

          ${best.items} av
          ${selectedResults.length}
          valda produkter finns i denna butik.

        </div>


        <div class="cheapest">

          <div class="best-label">
            TOTAL FÖR TILLGÄNGLIGA PRODUKTER
          </div>

          <div class="store-row">

            <span class="store-name">
              ${escapeHtml(best.name)}
            </span>

            <span class="price">
              ${formatPrice(best.total)}
            </span>

          </div>

        </div>

      </div>

    `;

  }


  function renderSmart(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults
      );


    if (!totals.length) {

      smartResults.innerHTML =
        "Vi hittade inte tillräckligt med data ännu.";

      return;

    }


    totals.sort((a, b) => {

      if (b.items !== a.items) {
        return b.items - a.items;
      }

      return a.total - b.total;

    });


    const best =
      totals[0];


    smartResults.innerHTML = `

      <strong>
        ${escapeHtml(best.name)}
      </strong>

      har just nu det bästa alternativet
      bland de butiker där vi hittar dina valda produkter.

      <br><br>

      ${best.items} av
      ${selectedResults.length}
      produkter:

      <strong>
        ${formatPrice(best.total)}
      </strong>

      <br><br>

      <small>
        🚗 Nästa steg blir att väga in avstånd,
        restid och hur mycket du faktiskt sparar
        på att åka till flera butiker.
      </small>

    `;

  }


  /*
   * STEG 1:
   *
   * Hämta produkter och visa rullistor.
   */

  findProductsButton.addEventListener(
    "click",
    async function() {

      const postcode =
        postcodeInput.value.trim();


      const items =
        shoppingList.value
          .split("\n")
          .map(item => item.trim())
          .filter(item => item.length > 0);


      message.innerHTML = "";

      results.classList.add("hidden");

      selectionBox.classList.add("hidden");


      if (!postcode) {

        message.innerHTML =
          '<div class="error">Skriv in ditt postnummer.</div>';

        return;

      }


      if (!/^\d{5}$/.test(postcode)) {

        message.innerHTML =
          '<div class="error">Postnumret måste innehålla 5 siffror.</div>';

        return;

      }


      if (!items.length) {

        message.innerHTML =
          '<div class="error">Skriv minst en vara i inköpslistan.</div>';

        return;

      }


      findProductsButton.disabled =
        true;

      findProductsButton.textContent =
        "⏳ Hittar produkter...";


      message.innerHTML =
        '<div class="loading">Hämtar produktalternativ...</div>';


      try {

        allResults = [];


        for (
          const item of items
        ) {

          const products =
            await getProducts(
              item,
              postcode
            );


          allResults.push({

            item,

            products

          });

        }


        renderProductSelections();


        selectionBox.classList.remove(
          "hidden"
        );


        message.innerHTML = "";


        selectionBox.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(error);


        message.innerHTML = `

          <div class="error">

            Något gick fel när produkterna
            skulle hämtas.

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

      } finally {

        findProductsButton.disabled =
          false;

        findProductsButton.textContent =
          "🔎 Hitta produkter";

      }

    }
  );


  /*
   * STEG 2:
   *
   * Jämför exakt de produkter användaren
   * valt i rullistorna.
   */

  compareSelectedButton.addEventListener(
    "click",
    function() {

      const selectedResults =
        getSelectedProducts();


      if (!selectedResults.length) {

        message.innerHTML =
          '<div class="error">Välj minst en produkt först.</div>';

        return;

      }


      const matchedCount =
        selectedResults.filter(result => {

          return getSameProductPrices(
            result.selectedProduct,
            result.products
          ).length > 0;

        }).length;


      summary.innerHTML = `

        <div class="summary">

          <div class="summary-title">
            DIN KORG
          </div>

          <div class="summary-price">
            ${matchedCount} av
            ${selectedResults.length}
          </div>

          <div>
            valda produkter kunde jämföras
            mellan butikerna
          </div>

        </div>

      `;


      cheapestResults.innerHTML =
        selectedResults
          .map(result =>
            createItemHtml(result)
          )
          .join("");


      renderOneStore(
        selectedResults
      );


      renderSmart(
        selectedResults
      );


      results.classList.remove(
        "hidden"
      );


      results.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }
  );

</script>
