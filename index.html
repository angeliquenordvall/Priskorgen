  </style></head><body><div class="container">  <h1>🛒 Priskorgen</h1>  <p class="subtitle">

  </p>  <div class="box"><label for="postcode">📍 Postnummer</label>

<input

  </div>  <!-- PRODUKTVAL -->  <div id="selectionBox" class="box hidden"><h2>🛍️ Välj dina produkter</h2>

<div class="box">

</div>


<div class="box">

</div>


<div class="box">

    </div>

  </div>  <div class="attribution">Prisdata från

<a

  </div></div><script>

  const findProductsButton =
    document.getElementById("findProductsButton");

  const compareSelectedButton =
    document.getElementById("compareSelectedButton");

  const postcodeInput =
    document.getElementById("postcode");

  const shoppingList =
    document.getElementById("shoppingList");

  const selectionBox =
    document.getElementById("selectionBox");

  const productSelections =
    document.getElementById("productSelections");

  const results =
    document.getElementById("results");

  const summary =
    document.getElementById("summary");

  const cheapestResults =
    document.getElementById("cheapestResults");

  const oneStoreResults =
    document.getElementById("oneStoreResults");

  const smartResults =
    document.getElementById("smartResults");

  const message =
    document.getElementById("message");


  const storeNames = {

    coop: "Coop",
    ica: "ICA",
    lidl: "Lidl",
    willys: "Willys",
    hemkop: "Hemköp"

  };


  let allResults = [];


  function formatPrice(price) {

    if (
      price === null ||
      price === undefined
    ) {
      return "–";
    }

    return Number(price)
      .toFixed(2)
      .replace(".", ",") + " kr";

  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getStoreName(product) {

    return storeNames[product.chain]
      || product.chain
      || "Okänd butik";

  }


  function normalizeText(text) {

    return String(text)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9åäö\s]/gi, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  function singularizeWord(word) {

    if (
      word.length > 5 &&
      word.endsWith("or")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("ar")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("er")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("en")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("et")
    ) {
      return word.slice(0, -2);
    }

    return word;

  }


  /*
   * Sökord från användaren.
   *
   * Vi använder dessa för att rangordna
   * Primats träffar, men vi filtrerar inte bort
   * produkter bara för att de inte ligger högst.
   */

  function getSearchTerms(item) {

    return normalizeText(item)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function productText(product) {

    return normalizeText(

      [
        product.name || "",
        product.brand || "",
        product.category || "",
        product.package || ""
      ].join(" ")

    );

  }


  function getProductWords(product) {

    return productText(product)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function categoryText(product) {

    return normalizeText(
      product.category || ""
    );

  }


  /*
   * NY MATCHNING:
   *
   * Vi försöker inte längre bestämma att
   * exempelvis "kaffe" måste vara bryggkaffe.
   *
   * Alla produkter från Primats sökning får
   * vara med.
   *
   * Poängen används ENDAST för ordningen.
   */

  function scoreProduct(item, product) {

    if (
      !product ||
      product.available === false
    ) {
      return -Infinity;
    }


    const query =
      normalizeText(item);

    const queryWords =
      getSearchTerms(item);

    const name =
      normalizeText(product.name || "");

    const brand =
      normalizeText(product.brand || "");

    const category =
      categoryText(product);

    const fullText =
      productText(product);

    const productWords =
      getProductWords(product);


    let score = 0;


    /*
     * Exakt hela produktnamnet.
     */

    if (name === query) {
      score += 1000;
    }


    /*
     * Produktnamnet börjar med hela sökningen.
     *
     * Exempel:
     * "kaffe" ->
     * "Kaffe Brygg..."
     */

    if (
      query &&
      name.startsWith(query)
    ) {
      score += 300;
    }


    /*
     * Sökningen finns som ett helt ord
     * i produktnamnet.
     */

    if (
      query &&
      productWords.includes(query)
    ) {
      score += 250;
    }


    /*
     * Sökningen finns någonstans i namnet.
     */

    if (
      query &&
      name.includes(query)
    ) {
      score += 150;
    }


    /*
     * Varje enskilt sökord.
     *
     * Alla ord måste alltså inte finnas i namnet
     * för att produkten ska visas.
     */

    for (
      const word of queryWords
    ) {

      if (!word) {
        continue;
      }


      if (
        productWords.includes(word)
      ) {
        score += 100;
      }


      if (
        category
          .split(" ")
          .map(singularizeWord)
          .includes(word)
      ) {
        score += 60;
      }


      if (
        brand === word
      ) {
        score += 30;
      }


      if (
        fullText.includes(word)
      ) {
        score += 20;
      }

    }


    /*
     * Alla sökord finns någonstans i produkten.
     * Detta ger en extra bonus vid flerordsökningar.
     */

    if (
      queryWords.length > 1 &&
      queryWords.every(
        word => fullText.includes(word)
      )
    ) {
      score += 200;
    }


    /*
     * Om hela sökningen finns exakt i namnet
     * ska den ligga mycket högt.
     */

    if (
      query &&
      name === query
    ) {
      score += 500;
    }


    /*
     * Pris används bara som sista sorteringsfaktor
     * och påverkar inte om produkten får visas.
     */

    return score;

  }


  async function getProducts(
    query,
    postcode
  ) {

    const url =
      "/api/primat?q=" +
      encodeURIComponent(query) +
      "&postcode=" +
      encodeURIComponent(postcode);


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Kunde inte hämta prisdata för " +
        query
      );

    }


    const data =
      await response.json();


    if (
      !data.products ||
      !data.products.data
    ) {
      return [];
    }


    return data.products.data;

  }


  /*
   * GTIN är den bästa identiteten för en produkt.
   *
   * Om GTIN saknas använder vi namn +
   * varumärke + förpackning.
   */

  function getProductKey(product) {

    if (product.gtin) {
      return "gtin:" + product.gtin;
    }


    return [

      normalizeText(product.name || ""),

      normalizeText(product.brand || ""),

      normalizeText(
        product.package ||
        (
          product.amount
            ? product.amount +
              " " +
              (product.unit || "")
            : ""
        )
      )

    ].join("|");

  }


  /*
   * Tar fram produktalternativen.
   *
   * VIKTIGT:
   *
   * Vi filtrerar INTE längre bort produkter
   * med låg matchningspoäng.
   *
   * Primats sökning bestämmer vilka produkter
   * som hör till sökningen.
   *
   * Vår poäng bestämmer bara ordningen.
   */

  function getProductChoices(
    item,
    products
  ) {

    const candidates =
      products
        .filter(product => {

          return product &&
            product.available !== false;

        })
        .map(product => {

          return {

            product,

            score:
              scoreProduct(
                item,
                product
              )

          };

        });


    candidates.sort((a, b) => {

      if (b.score !== a.score) {
        return b.score - a.score;
      }


      const aPrice =
        typeof a.product.prices?.effective === "number"
          ? a.product.prices.effective
          : Infinity;


      const bPrice =
        typeof b.product.prices?.effective === "number"
          ? b.product.prices.effective
          : Infinity;


      return aPrice - bPrice;

    });


    const unique = [];
    const seen = new Set();


    for (
      const entry of candidates
    ) {

      const key =
        getProductKey(entry.product);


      if (seen.has(key)) {
        continue;
      }


      seen.add(key);

      unique.push(entry.product);


      /*
       * Vi visar de 20 bästa unika alternativen.
       */

      if (
        unique.length >= 20
      ) {
        break;
      }

    }


    return unique;

  }


  /*
   * Visar produktvalen.
   */

  function renderProductSelections() {

    productSelections.innerHTML = "";


    allResults.forEach(
      (result, index) => {

        const choices =
          getProductChoices(
            result.item,
            result.products
          );


        const wrapper =
          document.createElement("div");

        wrapper.className = "item";


        const title =
          document.createElement("div");

        title.className = "item-name";

        title.textContent =
          result.item;


        wrapper.appendChild(title);


        if (!choices.length) {

          const empty =
            document.createElement("div");

          empty.className = "empty";

          empty.textContent =
            "Ingen produkt hittades.";

          wrapper.appendChild(empty);


          result.choices = [];

          productSelections.appendChild(
            wrapper
          );

          return;

        }


        result.choices =
          choices;


        const choiceBox =
          document.createElement("div");

        choiceBox.className =
          "product-choice";


        const label =
          document.createElement("label");

        label.textContent =
          "Välj produkt:";


        choiceBox.appendChild(label);


        const select =
          document.createElement("select");

        select.id =
          "product-select-" + index;


        choices.forEach(
          (product, choiceIndex) => {

            const option =
              document.createElement("option");

            option.value =
              String(choiceIndex);


            const packageText =
              product.package ||
              (
                product.amount
                  ? product.amount +
                    " " +
                    (product.unit || "")
                  : ""
              );


            const brand =
              product.brand
                ? product.brand + " • "
                : "";


            const price =
              typeof product.prices?.effective === "number"
                ? " • " +
                  formatPrice(
                    product.prices.effective
                  )
                : "";


            option.textContent =
              product.name +
              (
                brand
                  ? " — " +
                    brand.trim()
                  : ""
              ) +
              (
                packageText
                  ? " • " +
                    packageText
                  : ""
              ) +
              price;


            select.appendChild(
              option
            );

          }
        );


        choiceBox.appendChild(
          select
        );


        const help =
          document.createElement("div");

        help.className =
          "choice-help";

        help.textContent =
          choices.length +
          " produktalternativ visas. Mest exakt matchning ligger överst.";


        choiceBox.appendChild(
          help
        );


        wrapper.appendChild(
          choiceBox
        );


        productSelections.appendChild(
          wrapper
        );

      }
    );

  }


  /*
   * Hämtar de produkter användaren faktiskt
   * valde i rullistorna.
   */

  function getSelectedProducts() {

    const selectedResults = [];


    allResults.forEach(
      (result, index) => {

        const select =
          document.getElementById(
            "product-select-" + index
          );


        if (
          !select ||
          !result.choices ||
          !result.choices.length
        ) {
          return;
        }


        const choiceIndex =
          Number(select.value);


        const selected =
          result.choices[
            choiceIndex
          ];


        if (!selected) {
          return;
        }


        selectedResults.push({

          item:
            result.item,

          selectedProduct:
            selected,

          products:
            result.products

        });

      }
    );


    return selectedResults;

  }


  /*
   * När användaren valt en produkt jämför vi
   * samma produktidentifierare mot butikerna.
   */

  function getSameProductPrices(
    selectedProduct,
    products
  ) {

    const selectedKey =
      getProductKey(
        selectedProduct
      );


    const matches =
      products.filter(product => {

        if (
          !product ||
          product.available === false ||
          !product.prices ||
          typeof product.prices.effective !== "number"
        ) {
          return false;
        }


        return (
          getProductKey(product) ===
          selectedKey
        );

      });


    const byStore = {};


    matches.forEach(product => {

      const key =
        product.chain +
        ":" +
        product.store_id;


      if (!byStore[key]) {
        byStore[key] = product;
      }

    });


    return Object.values(
      byStore
    );

  }


  function createItemHtml(
    result
  ) {

    const selected =
      result.selectedProduct;


    const matches =
      getSameProductPrices(
        selected,
        result.products
      );


    matches.sort(
      (a, b) =>
        a.prices.effective -
        b.prices.effective
    );


    if (!matches.length) {

      return `

        <div class="item">

          <div class="item-name">
            ${escapeHtml(
              selected.name
            )}
          </div>

          <div class="empty">

            Ingen butik med denna exakta
            produkt hittades i prisdatan.

          </div>

        </div>

      `;

    }


    const cheapest =
      matches[0];


    const packageText =
      selected.package ||
      (
        selected.amount
          ? selected.amount +
            " " +
            (selected.unit || "")
          : ""
      );


    return `

      <div class="item">

        <div class="item-name">
          ${escapeHtml(
            selected.name
          )}
        </div>

        <div class="item-meta">

          ${escapeHtml(
            selected.brand || ""
          )}

          ${
            packageText
              ? " • " +
                escapeHtml(
                  packageText
                )
              : ""
          }

        </div>


        <div class="cheapest">

          <div class="best-label">
            BILLIGAST
          </div>

          <div class="store-row">

            <span class="store-name">
              ${escapeHtml(
                getStoreName(
                  cheapest
                )
              )}
            </span>

            <span class="price">
              ${formatPrice(
                cheapest.prices.effective
              )}
            </span>

          </div>

        </div>


        <div style="margin-top:10px;">

          ${
            matches.map(
              product => `

              <div class="store-row">

                <span class="store-name">
                  ${escapeHtml(
                    getStoreName(
                      product
                    )
                  )}
                </span>

                <span class="price">
                  ${formatPrice(
                    product.prices.effective
                  )}
                </span>

              </div>

            `
            ).join("")
          }

        </div>

      </div>

    `;

  }


  /*
   * Beräknar totalen per butik.
   */

  function calculateStoreTotals(
    selectedResults
  ) {

    const totals = {};


    for (
      const result of selectedResults
    ) {

      const matches =
        getSameProductPrices(
          result.selectedProduct,
          result.products
        );


      matches.forEach(product => {

        const storeKey =
          product.chain +
          ":" +
          product.store_id;


        if (!totals[storeKey]) {

          totals[storeKey] = {

            chain:
              product.chain,

            store_id:
              product.store_id,

            name:
              getStoreName(
                product
              ),

            total:
              0,

            items:
              0

          };

        }


        totals[storeKey].total +=
          product.prices.effective;


        totals[storeKey].items += 1;

      });

    }


    return Object.values(
      totals
    );

  }


  function renderOneStore(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults
      );


    if (!totals.length) {

      oneStoreResults.innerHTML =
        '<div class="empty">Ingen butik kunde räknas fram.</div>';

      return;

    }


    totals.sort((a, b) => {

      if (
        b.items !== a.items
      ) {
        return b.items - a.items;
      }


      return (
        a.total -
        b.total
      );

    });


    const best =
      totals[0];


    oneStoreResults.innerHTML = `

      <div class="item">

        <div class="item-name">
          🏆 ${escapeHtml(
            best.name
          )}
        </div>

        <div class="item-meta">

          ${best.items} av
          ${selectedResults.length}
          valda produkter finns i denna butik.

        </div>


        <div class="cheapest">

          <div class="best-label">
            TOTAL FÖR TILLGÄNGLIGA PRODUKTER
          </div>

          <div class="store-row">

            <span class="store-name">
              ${escapeHtml(
                best.name
              )}
            </span>

            <span class="price">
              ${formatPrice(
                best.total
              )}
            </span>

          </div>

        </div>

      </div>

    `;

  }


  function renderSmart(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults
      );


    if (!totals.length) {

      smartResults.innerHTML =
        "Vi hittade inte tillräckligt med data ännu.";

      return;

    }


    totals.sort((a, b) => {

      if (
        b.items !== a.items
      ) {
        return b.items - a.items;
      }


      return (
        a.total -
        b.total
      );

    });


    const best =
      totals[0];


    smartResults.innerHTML = `

      <strong>
        ${escapeHtml(
          best.name
        )}
      </strong>

      har just nu det bästa alternativet
      bland de butiker där vi hittar dina valda produkter.

      <br><br>

      ${best.items} av
      ${selectedResults.length}
      produkter:

      <strong>
        ${formatPrice(
          best.total
        )}
      </strong>

      <br><br>

      <small>
        🚗 Nästa steg blir att väga in avstånd,
        restid och hur mycket du faktiskt sparar
        på att åka till flera butiker.
      </small>

    `;

  }


  /*
   * STEG 1:
   *
   * Hämta produkter och visa rullistor.
   */

  findProductsButton.addEventListener(
    "click",
    async function() {

      const postcode =
        postcodeInput.value.trim();


      const items =
        shoppingList.value
          .split("\n")
          .map(
            item => item.trim()
          )
          .filter(
            item => item.length > 0
          );


      message.innerHTML = "";

      results.classList.add(
        "hidden"
      );

      selectionBox.classList.add(
        "hidden"
      );


      if (!postcode) {

        message.innerHTML =
          '<div class="error">Skriv in ditt postnummer.</div>';

        return;

      }


      if (
        !/^\d{5}$/.test(
          postcode
        )
      ) {

        message.innerHTML =
          '<div class="error">Postnumret måste innehålla 5 siffror.</div>';

        return;

      }


      if (!items.length) {

        message.innerHTML =
          '<div class="error">Skriv minst en vara i inköpslistan.</div>';

        return;

      }


      findProductsButton.disabled =
        true;

      findProductsButton.textContent =
        "⏳ Hittar produkter...";


      message.innerHTML =
        '<div class="loading">Hämtar produktalternativ...</div>';


      try {

        allResults = [];


        for (
          const item of items
        ) {

          const products =
            await getProducts(
              item,
              postcode
            );


          allResults.push({

            item,

            products

          });

        }


        renderProductSelections();


        selectionBox.classList.remove(
          "hidden"
        );


        message.innerHTML = "";


        selectionBox.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(error);


        message.innerHTML = `

          <div class="error">

            Något gick fel när produkterna
            skulle hämtas.

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

      } finally {

        findProductsButton.disabled =
          false;

        findProductsButton.textContent =
          "🔎 Hitta produkter";

      }

    }
  );


  /*
   * STEG 2:
   *
   * Jämför exakt de produkter användaren
   * valt i rullistorna.
   */

  compareSelectedButton.addEventListener(
    "click",
    function() {

      const selectedResults =
        getSelectedProducts();


      if (
        !selectedResults.length
      ) {

        message.innerHTML =
          '<div class="error">Välj minst en produkt först.</div>';

        return;

      }


      const matchedCount =
        selectedResults.filter(
          result => {

            return getSameProductPrices(
              result.selectedProduct,
              result.products
            ).length > 0;

          }
        ).length;


      summary.innerHTML = `

        <div class="summary">

          <div class="summary-title">
            DIN KORG
          </div>

          <div class="summary-price">
            ${matchedCount} av
            ${selectedResults.length}
          </div>

          <div>
            valda produkter kunde jämföras
            mellan butikerna
          </div>

        </div>

      `;


      cheapestResults.innerHTML =
        selectedResults
          .map(
            result =>
              createItemHtml(
                result
              )
          )
          .join("");


      renderOneStore(
        selectedResults
      );


      renderSmart(
        selectedResults
      );


      results.classList.remove(
        "hidden"
      );


      results.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }
  );

</script></body>
