    .container {

      margin-top: 12px;

    }

    button:disabled {

      cursor: wait;

    .secondary-button {

    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .item-meta {

      font-size: 14px;
      margin-bottom: 12px;
    }

    .product-choice {

    }

    .product-count {

    }

    .product-filters {

    }

    .filter-button.active {
      background: #111;

      border-color: #111;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

      background: white;
      color: #222;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-weight: normal;
      cursor: pointer;
    }

    .product-card:hover {
      border-color: #999;
    }

    .product-card.selected {
      border: 2px solid #287a35;
      background: #eef8ef;
      padding: 11px 12px;
    }
