<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Priskorgen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 14px 50px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #666;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    h2 {
      font-size: 22px;
      margin: 0 0 14px;
    }

    h3 {
      font-size: 18px;
      margin: 0;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .item-meta {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .store-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }

    .store-name {
      font-weight: 500;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
    }

    .cheapest {
      background: #eef8ef;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
    }

    .best-label {
      font-size: 13px;
      color: #287a35;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .smart {
      background: #f1f5ff;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .smart-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    .error {
      background: #fff0f0;
      color: #a40000;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    .attribution {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }

    .attribution a {
      color: inherit;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .container {
        padding: 16px 10px 40px;
      }

      .box {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🛒 Priskorgen</h1>
    <p class="subtitle">
      Hitta billigaste sättet att handla din korg.
    </p>

    <div class="box">

      <label for="postcode">📍 Postnummer</label>

      <input
        id="postcode"
        type="text"
        value="89132"
        maxlength="5"
        inputmode="numeric"
      >

      <br><br>

      <label for="shoppingList">🛍️ Din inköpslista</label>

      <textarea
        id="shoppingList"
        placeholder="Skriv en vara
