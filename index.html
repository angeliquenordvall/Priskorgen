<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matprisappen</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f6f7;
  color: #222;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #666;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 140px;
  padding: 15px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 12px;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.mode {
  background: white;
  padding: 16px;
  margin-top: 15px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.total {
  font-size: 24px;
  font-weight: bold;
  margin: 10px 0;
}

.small {
  color: #666;
  font-size: 14px;
}

.store {
  margin-top: 10px;
  padding: 10px;
  background: #f1f1f1;
  border-radius: 8px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #ddd;
}

.error {
  margin-top: 15px;
  padding: 12px;
  background: #ffe5e5;
  color: #a00000;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🛒 Matprisappen</h1>

<div class="subtitle">
Skriv din inköpslista och jämför priser
</div>

<textarea id="shoppingList" placeholder="mjölk
ägg
kaffe
bananer
köttfärs"></textarea>

<button onclick="compareBasket()">
🔎 Jämför min korg
</button>

<div id="primatTest"></div>  

<div id="error"></div>

<div id="results">

<div class="mode">
<h2>🏪 En butik</h2>
<div id="oneStore"></div>
</div>

<div class="mode">
<h2>✨ Billigast möjligt</h2>
<div id="cheapest"></div>
</div>

<div class="mode">
<h2>🚗 Smartast</h2>
<div id="smart"></div>
</div>

</div>

</div>

<script>

const products = {
"mjölk": {
ICA:{price:19.95,member:17.95},
Coop:{price:20.90,member:18.90},
Willys:{price:17.95,member:17.95}
},
"ägg": {
ICA:{price:32.95,member:29.95},
Coop:{price:34.95,member:29.95},
Willys:{price:31.95,member:31.95}
},
"kaffe": {
ICA:{price:69.95,member:59.95},
Coop:{price:74.95,member:59.95},
Willys:{price:64.95,member:64.95}
},
"bananer": {
ICA:{price:27.95,member:24.95},
Coop:{price:29.90,member:25.90},
Willys:{price:23.95,member:23.95}
},
"köttfärs": {
ICA:{price:89.95,member:79.95},
Coop:{price:94.95,member:79.95},
Willys:{price:84.95,member:84.95}
}
};

const stores = ["ICA","Coop","Willys"];

function money(value) {
  return value.toFixed(2).replace(".",",") + " kr";
}

function compareBasket() {

  const input = document.getElementById("shoppingList").value;

  const items = input
    .split("\n")
    .map(x => x.toLowerCase().trim())
    .filter(x => x.length > 0);

  if(items.length === 0) {
    document.getElementById("error").innerHTML =
      "Skriv minst en vara.";
    return;
  }

  const knownItems = items.filter(item => products[item]);

  if(knownItems.length === 0) {
    document.getElementById("error").innerHTML =
      "Jag hittar inga av varorna ännu.";
    return;
  }

  document.getElementById("error").innerHTML = "";

  showOneStore(knownItems);
  showCheapest(knownItems);
  showSmart(knownItems);
}

function showOneStore(items) {

  let bestStore = "";
  let bestTotal = Infinity;

  stores.forEach(store => {

    let total = 0;

    items.forEach(item => {
      total += products[item][store].member;
    });

    if(total < bestTotal) {
      bestTotal = total;
      bestStore = store;
    }
  });

  document.getElementById("oneStore").innerHTML =
    "<div class='total'>" + money(bestTotal) + "</div>" +
    "<div class='small'>Billigast om allt köps i samma butik.</div>" +
    "<div class='store'><strong>" + bestStore + "</strong></div>";
}

function showCheapest(items) {

  let total = 0;
  let html = "";

  items.forEach(item => {

    let cheapest = Infinity;
    let store = "";

    stores.forEach(s => {

      let price = products[item][s].member;

      if(price < cheapest) {
        cheapest = price;
        store = s;
      }
    });

    total += cheapest;

    html +=
      "<div class='item'>" +
      "<span>" + item + " (" + store + ")</span>" +
      "<span>" + money(cheapest) + "</span>" +
      "</div>";
  });

  document.getElementById("cheapest").innerHTML =
    "<div class='total'>" + money(total) + "</div>" +
    "<div class='small'>Lägsta möjliga pris per vara.</div>" +
    "<div class='store'>" + html + "</div>";
}

function showSmart(items) {

  let bestOneStoreTotal = Infinity;
  let bestOneStore = "";

  stores.forEach(store => {

    let total = 0;

    items.forEach(item => {
      total += products[item][store].member;
    });

    if(total < bestOneStoreTotal) {
      bestOneStoreTotal = total;
      bestOneStore = store;
    }
  });

  let bestSmartTotal = bestOneStoreTotal;
  let bestSmartStores = [bestOneStore];

  for(let i = 0; i < stores.length; i++) {

    for(let j = i + 1; j < stores.length; j++) {

      const selected = [stores[i], stores[j]];
      let total = 0;

      items.forEach(item => {

        let cheapest = Infinity;

        selected.forEach(store => {

          const price = products[item][store].member;

          if(price < cheapest) {
            cheapest = price;
          }
        });

        total += cheapest;
      });

      if(total + 10 < bestSmartTotal) {
        bestSmartTotal = total;
        bestSmartStores = selected;
      }
    }
  }

  const saving = bestOneStoreTotal - bestSmartTotal;

  let html =
    "<div class='total'>" +
    money(bestSmartTotal) +
    "</div>";

  if(bestSmartStores.length === 1) {

    html +=
      "<div class='small'>" +
      "<strong>En butik är smartast.</strong><br><br>" +
      bestSmartStores[0] +
      " ger det bästa priset utan att behöva åka till flera butiker." +
      "</div>";

  } else {

    html +=
      "<div class='small'>" +
      "<strong>Två butiker är värda besväret.</strong><br><br>" +
      "Butiker: " +
      bestSmartStores.join(" + ") +
      "<br>" +
      "Du sparar cirka " +
      money(saving) +
      " jämfört med att handla allt i en butik." +
      "<br><br>" +
      "🚗 Eftersom besparingen är minst 10 kr kan den extra butiken vara värd en kort omväg." +
      "</div>";
  }

  document.getElementById("smart").innerHTML = html;
}

</script>

</body>
</html>
