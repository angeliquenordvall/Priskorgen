  const findProductsButton =

  const storeNames = {

    coop: "Coop",

    lidl: "Lidl",

    hemkop: "HemkÃ¶p"

  };


  let allResults = [];


  /*
   * Hur mÃ¥nga produkter som visas
   * innan anvÃ¤ndaren trycker "Visa fler".
   */

  const INITIAL_PRODUCTS_TO_SHOW = 8;

  const PRODUCTS_TO_ADD = 12;


  function formatPrice(price) {

    if (
      price === null ||
      price === undefined
    ) {
      return "â€“";
    }

    return Number(price)
      .toFixed(2)
      .replace(".", ",") + " kr";

  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getStoreName(product) {

    return storeNames[product.chain]
      || product.chain
      || "OkÃ¤nd butik";

  }


  function normalizeText(text) {

    return String(text)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9Ã¥Ã¤Ã¶\s]/gi, " ")
      .replace(/\s+/g, " ")
      .trim();

  }


  function singularizeWord(word) {

    if (
      word.length > 5 &&
      word.endsWith("or")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("ar")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("er")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("en")
    ) {
      return word.slice(0, -2);
    }

    if (
      word.length > 5 &&
      word.endsWith("et")
    ) {
      return word.slice(0, -2);
    }

    return word;

  }


  function getSearchTerms(item) {

    return normalizeText(item)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function productText(product) {

    return normalizeText(

      [
        product.name || "",
        product.brand || "",
        product.category || "",
        product.package || ""
      ].join(" ")

    );

  }


  function getProductWords(product) {

    return productText(product)
      .split(" ")
      .filter(Boolean)
      .map(singularizeWord);

  }


  function categoryText(product) {

    return normalizeText(
      product.category || ""
    );

  }


  /*
   * Produktens relevans bestÃ¤mmer ordningen.
   * Vi filtrerar inte bort produkter hÃ¤r.
   */

  function scoreProduct(item, product) {

    if (
      !product ||
      product.available === false
    ) {
      return -Infinity;
    }


    const query =
      normalizeText(item);

    const queryWords =
      getSearchTerms(item);

    const name =
      normalizeText(product.name || "");

    const brand =
      normalizeText(product.brand || "");

    const category =
      categoryText(product);

    const fullText =
      productText(product);

    const productWords =
      getProductWords(product);


    let score = 0;


    if (name === query) {
      score += 1000;
    }


    if (
      query &&
      name.startsWith(query)
    ) {
      score += 300;
    }


    if (
      query &&
      productWords.includes(query)
    ) {
      score += 250;
    }


    if (
      query &&
      name.includes(query)
    ) {
      score += 150;
    }


    for (
      const word of queryWords
    ) {

      if (!word) {
        continue;
      }


      if (
        productWords.includes(word)
      ) {
        score += 100;
      }


      if (
        category
          .split(" ")
          .map(singularizeWord)
          .includes(word)
      ) {
        score += 60;
      }


      if (
        brand === word
      ) {
        score += 30;
      }


      if (
        fullText.includes(word)
      ) {
        score += 20;
      }

    }


    if (
      queryWords.length > 1 &&
      queryWords.every(
        word => fullText.includes(word)
      )
    ) {
      score += 200;
    }


    if (
      query &&
      name === query
    ) {
      score += 500;
    }


    return score;

  }


  /*
   * Primat fÃ¥r fortfarande gÃ¶ra sÃ¶kningen.
   */

  function getQueryVariants(item) {

    const normalized =
      normalizeText(item);


    const variants = [item];


    if (normalized === "kaffe") {

      variants.push(
        "bryggkaffe",
        "malet kaffe",
        "kokkaffe",
        "kaffebÃ¶nor",
        "kaffekapslar"
      );

    }


    if (normalized === "smor") {

      variants.push(
        "smÃ¶r normalsaltat",
        "smÃ¶r extrasaltat",
        "smÃ¶r osaltat"
      );

    }


    if (normalized === "mjolk") {

      variants.push(
        "mjÃ¶lk",
        "standardmjÃ¶lk",
        "mellanmjÃ¶lk",
        "lÃ¤ttmjÃ¶lk"
      );

    }


    if (normalized === "brod") {

      variants.push(
        "brÃ¶d",
        "rostbrÃ¶d",
        "formfranska",
        "limpa"
      );

    }


    return [
      ...new Set(
        variants
      )
    ];

  }


  async function getProducts(
    query,
    postcode
  ) {

    const variants =
      getQueryVariants(query);


    const responses =
      await Promise.all(

        variants.map(
          async variant => {

            const url =
              "/api/primat?q=" +
              encodeURIComponent(variant) +
              "&postcode=" +
              encodeURIComponent(postcode);


            const response =
              await fetch(url);


            if (!response.ok) {

              throw new Error(
                "Kunde inte hÃ¤mta prisdata fÃ¶r " +
                variant
              );

            }


            const data =
              await response.json();


            if (
              !data.products ||
              !data.products.data
            ) {
              return [];
            }


            return data.products.data;

          }
        )

      );


    const productMap =
      new Map();


    for (
      const products of responses
    ) {

      for (
        const product of products
      ) {

        if (!product) {
          continue;
        }


        const key =
          product.gtin
            ? "gtin:" + product.gtin
            : [
                normalizeText(
                  product.name || ""
                ),
                normalizeText(
                  product.brand || ""
                ),
                normalizeText(
                  product.package || ""
                ),
                product.amount || "",
                product.unit || ""
              ].join("|");


        if (
          !productMap.has(key)
        ) {

          productMap.set(
            key,
            product
          );

        }

      }

    }


    return Array.from(
      productMap.values()
    );

  }


  function getProductKey(product) {

    if (product.gtin) {
      return "gtin:" + product.gtin;
    }


    return [

      normalizeText(product.name || ""),

      normalizeText(product.brand || ""),

      normalizeText(
        product.package ||
        (
          product.amount
            ? product.amount +
              " " +
              (product.unit || "")
            : ""
        )
      )

    ].join("|");

  }


  /*
   * -------------------------------------------------------
   * PRODUKTKATEGORIER
   * -------------------------------------------------------
   *
   * Vi anvÃ¤nder produktens namn och kategori fÃ¶r att
   * skapa enkla filter.
   *
   * Detta filtrerar inte bort produkter frÃ¥n sÃ¶kningen.
   * Det Ã¤r bara ett sÃ¤tt att gÃ¶ra mÃ¥nga trÃ¤ffar lÃ¤ttare
   * att Ã¶verblicka.
   */

  function getProductGroup(
    product
  ) {

    const text =
      productText(product);


    if (
      text.includes("bryggkaffe")
    ) {
      return "Bryggkaffe";
    }


    if (
      text.includes("kokkaffe")
    ) {
      return "Kokkaffe";
    }


    if (
      text.includes("kaffebÃ¶n")
    ) {
      return "KaffebÃ¶nor";
    }


    if (
      text.includes("kaffekaps")
      ||
      text.includes("kapslar")
    ) {
      return "Kaffekapslar";
    }


    if (
      text.includes("malet kaffe")
      ||
      text.includes("ground coffee")
    ) {
      return "Malet kaffe";
    }


    return "Ã–vrigt";

  }


  function getAvailableGroups(
    item,
    choices
  ) {

    const normalized =
      normalizeText(item);


    /*
     * Just nu anvÃ¤nder vi de mer specifika
     * grupperna frÃ¤mst fÃ¶r kaffe.
     *
     * FÃ¶r andra varor visas inte onÃ¶diga
     * filterknappar.
     */

    if (
      normalized !== "kaffe"
    ) {
      return [];
    }


    const groups =
      new Set();


    choices.forEach(
      product => {

        const group =
          getProductGroup(
            product
          );


        if (
          group !== "Ã–vrigt"
        ) {
          groups.add(group);
        }

      }
    );


    return Array.from(groups);

  }


  function getProductChoices(
    item,
    products
  ) {

    const candidates =
      products
        .filter(product => {

          return product &&
            product.available !== false;

        })
        .map(product => {

          return {

            product,

            score:
              scoreProduct(
                item,
                product
              )

          };

        });


    candidates.sort((a, b) => {

      if (
        b.score !== a.score
      ) {
        return b.score - a.score;
      }


      const aPrice =
        typeof a.product.prices?.effective === "number"
          ? a.product.prices.effective
          : Infinity;


      const bPrice =
        typeof b.product.prices?.effective === "number"
          ? b.product.prices.effective
          : Infinity;


      return aPrice - bPrice;

    });


    const unique = [];
    const seen = new Set();


    for (
      const entry of candidates
    ) {

      const key =
        getProductKey(
          entry.product
        );


      if (
        seen.has(key)
      ) {
        continue;
      }


      seen.add(key);

      unique.push(
        entry.product
      );


      if (
        unique.length >= 100
      ) {
        break;
      }

    }


    return unique;

  }


  /*
   * Visar ett produktkort.
   */

  function createProductCard(
    result,
    product,
    index,
    selectedProduct
  ) {

    const card =
      document.createElement("button");

    card.type = "button";

    card.className =
      "product-card";


    const isSelected =

      getProductKey(selectedProduct) ===

    if (isSelected) {
      card.classList.add("selected");
    }


    const name =
      document.createElement("div");

    name.className =
      "product-card-name";

    name.textContent =
      product.name || "OkÃ¤nd produkt";


    card.appendChild(
      name
    );


    const meta =
      document.createElement("div");

    meta.className =
      "product-card-meta";


    const metaParts = [];


    if (product.brand) {
      metaParts.push(
        product.brand
      );
    }


    const packageText =
      product.package ||
      (
        product.amount
          ? product.amount +
            " " +
            (product.unit || "")
          : ""
      );


    if (packageText) {
      metaParts.push(
        packageText
      );
    }


    meta.textContent =
      metaParts.join(" â€¢ ");


    card.appendChild(
      meta
    );


    const price =
      document.createElement("div");

    price.className =
      "product-card-price";


    if (
      typeof product.prices?.effective === "number"
    ) {

      price.textContent =
        formatPrice(
          product.prices.effective
        ) +
        " frÃ¥n";

    } else {

      price.textContent =
        "Pris saknas";

    }


    card.appendChild(
      price
    );


    if (isSelected) {

      const selectedLabel =
        document.createElement("div");

        "selected-label";

      selectedLabel.textContent =
        "âœ“ VALD PRODUKT";

      card.appendChild(
        selectedLabel
      );

        result.selectedProduct =

  /*
   * Renderar sjÃ¤lva produktvÃ¤ljaren.
   */

  function renderProductSelections() {

    productSelections.innerHTML = "";


    allResults.forEach(
      (result, index) => {

        const choices =
          getProductChoices(
            result.item,
            result.products
          );


        const wrapper =
          document.createElement("div");

        wrapper.className =
          "item";


        const title =
          document.createElement("div");

        title.className =
          "item-name";

        title.textContent =
          result.item;


        wrapper.appendChild(
          title
        );


        if (
          !choices.length
        ) {

          const empty =
            document.createElement("div");

          empty.className =
            "empty";

          empty.textContent =
            "Ingen produkt hittades.";

          wrapper.appendChild(
            empty
          );


          result.choices = [];

          result.selectedProduct =
            null;


          productSelections.appendChild(
            wrapper
          );

          return;

        }


        result.choices =
          choices;


        /*
         * Om anvÃ¤ndaren redan valt en produkt
         * behÃ¥ller vi valet nÃ¤r sidan ritas om.
         */

        if (
          !result.selectedProduct
        ) {

          result.selectedProduct =
            null;

        }


        const choiceBox =
          document.createElement("div");

        choiceBox.className =
          "product-choice";


        const count =
          document.createElement("div");

        count.className =
          "product-count";

        count.textContent =
          choices.length +
          " mÃ¶jliga produkter hittades.";


        choiceBox.appendChild(
          count
        );


        /*
         * FILTER
         */

        const groups =
          getAvailableGroups(
            result.item,
            choices
          );


        let activeGroup =
          result.activeGroup ||
          "Alla";


        const filters =
          document.createElement("div");

        filters.className =
          "product-filters";


        if (groups.length > 0) {

          const allButton =
            document.createElement("button");

          allButton.type = "button";

          allButton.className =
            "filter-button";


          if (
            activeGroup === "Alla"
          ) {
            allButton.classList.add("active");
          }


          allButton.textContent =
            "Alla";


          allButton.addEventListener(
            "click",
            function() {

              result.activeGroup =
                "Alla";

              result.visibleCount =
                INITIAL_PRODUCTS_TO_SHOW;

              renderProductSelections();

            }
          );


          filters.appendChild(
            allButton
          );


          groups.forEach(
            group => {

              const filterButton =
                document.createElement("button");

              filterButton.type = "button";

              filterButton.className =
                "filter-button";


              if (
                activeGroup === group
              ) {
                filterButton.classList.add(
                  "active"
                );
              }


              filterButton.textContent =
                group;


              filterButton.addEventListener(
                "click",
                function() {

                  result.activeGroup =
                    group;

                  result.visibleCount =
                    INITIAL_PRODUCTS_TO_SHOW;

                  renderProductSelections();

                }
              );


              filters.appendChild(
                filterButton
              );

            }
          );


          choiceBox.appendChild(
            filters
          );

        }


        /*
         * FILTRERA ENDAST FÃ–R VISNING.
         */

        let visibleChoices =
          choices;


        if (
          activeGroup !== "Alla"
        ) {

          visibleChoices =
            choices.filter(
              product =>
                getProductGroup(product) ===
                activeGroup
            );

        }


        const visibleCount =
          result.visibleCount ||
          INITIAL_PRODUCTS_TO_SHOW;


        const productsToRender =
          visibleChoices.slice(
            0,
            visibleCount
          );


        const productList =
          document.createElement("div");

        productList.className =
          "product-list";


        productsToRender.forEach(
          product => {

            productList.appendChild(
              createProductCard(
                result,
                product,
                index,
                result.selectedProduct
              )
            );

          }
        );


        choiceBox.appendChild(
          productList
        );


        /*
         * VISA FLER
         */

        if (
          visibleChoices.length >
          visibleCount
        ) {

          const showMore =
            document.createElement("button");

          showMore.type = "button";

          showMore.className =
            "show-more-button";

          showMore.textContent =
            "Visa fler produkter (" +
            (
              visibleChoices.length -
              visibleCount
            ) +
            " kvar)";


          showMore.addEventListener(
            "click",
            function() {

              result.visibleCount =
                visibleCount +
                PRODUCTS_TO_ADD;

              renderProductSelections();

            }
          );


          choiceBox.appendChild(
            showMore
          );

        }


        const help =
          document.createElement("div");

        help.className =
          "choice-help";


        if (
          result.selectedProduct
        ) {

          help.textContent =
            "âœ“ Produkten Ã¤r vald. Du kan Ã¤ndra valet ovan.";

        } else {

          help.textContent =
            "Tryck pÃ¥ en produkt fÃ¶r att vÃ¤lja den.";

        }


        choiceBox.appendChild(
          help
        );


        wrapper.appendChild(
          choiceBox
        );


        productSelections.appendChild(
          wrapper
        );

      }
    );

  }


  function getSelectedProducts() {

    const selectedResults = [];


    allResults.forEach(
      result => {

        if (
          !result.selectedProduct
        ) {
          return;
        }


        selectedResults.push({

          item:
            result.item,

          selectedProduct:
            result.selectedProduct,

          products:
            result.products

        });

      }
    );


    return selectedResults;

  }


  function getSameProductPrices(
    selectedProduct,
    products
  ) {

    const selectedKey =
      getProductKey(
        selectedProduct
      );


    const matches =
      products.filter(product => {

        if (
          !product ||
          product.available === false ||
          !product.prices ||
          typeof product.prices.effective !== "number"
        ) {
          return false;
        }


        return (
          getProductKey(product) ===
          selectedKey
        );

      });


    const byStore = {};


    matches.forEach(product => {

      const key =
        product.chain +
        ":" +
        product.store_id;


      if (!byStore[key]) {
        byStore[key] = product;
      }

    });


    return Object.values(
      byStore
    );

  }


  function createItemHtml(
    result
  ) {

    const selected =
      result.selectedProduct;


    const matches =
      getSameProductPrices(
        selected,
        result.products
      );


    matches.sort(
      (a, b) =>
        a.prices.effective -
        b.prices.effective
    );


    if (
      !matches.length
    ) {

      return `

        <div class="item">

          <div class="item-name">
            ${escapeHtml(
              selected.name
            )}
          </div>

          <div class="empty">

            Ingen butik med denna exakta
            produkt hittades i prisdatan.

          </div>

        </div>

      `;

    }


    const cheapest =
      matches[0];


    const packageText =
      selected.package ||
      (
        selected.amount
          ? selected.amount +
            " " +
            (selected.unit || "")
          : ""
      );


    return `

      <div class="item">

        <div class="item-name">
          ${escapeHtml(
            selected.name
          )}
        </div>

        <div class="item-meta">

          ${escapeHtml(
            selected.brand || ""
          )}

          ${
            packageText
              ? " â€¢ " +
                escapeHtml(
                  packageText

              : ""

        </div>


        <div class="cheapest">

          <div class="best-label">
            BILLIGAST
          </div>

          <div class="store-row">

            <span class="store-name">
              ${escapeHtml(
                getStoreName(

                )
              )}
            </span>

            <span class="price">
              ${formatPrice(
                cheapest.prices.effective
              )}
            </span>

          </div>

        </div>


        <div style="margin-top:10px;">

          ${
            matches.map(
              product => `

              <div class="store-row">

                <span class="store-name">
                  ${escapeHtml(
                    getStoreName(
                      product
                    )
                  )}
                </span>

                <span class="price">
                  ${formatPrice(
                    product.prices.effective
                  )}
                </span>

              </div>

            `
            ).join("")
          }

        </div>

      </div>

    `;

  }


  function calculateStoreTotals(
    selectedResults
  ) {

    const totals = {};


    for (
      const result of selectedResults
    ) {

      const matches =
        getSameProductPrices(
          result.selectedProduct,
          result.products
        );


      matches.forEach(product => {

        const storeKey =
          product.chain +
          ":" +
          product.store_id;


        if (!totals[storeKey]) {

          totals[storeKey] = {

            chain:
              product.chain,

            store_id:
              product.store_id,

            name:
              getStoreName(
                product
              ),

            total:
              0,

            items:
              0

          };

        }


        totals[storeKey].total +=
          product.prices.effective;


        totals[storeKey].items += 1;

      });

    }


    return Object.values(
      totals
    );

  }


  function renderOneStore(
    selectedResults
  ) {

    const totals =
      calculateStoreTotals(
        selectedResults

    if (
      !totals.length

        '<div class="empty">Ingen butik kunde rÃ¤knas fram.</div>';

      return;

    }


    totals.sort((a, b) => {

      if (
        b.items !== a.items
      ) {
        return b.items - a.items;
      }


      return (
        a.total -
        b.total
      );

    });


    const best =
      totals[0];


    oneStoreResults.innerHTML = `

    `;

  }

      <strong>

  findProductsButton.addEventListener(
    "click",
    async function() {

      const postcode =
        postcodeInput.value.trim();


      const items =
        shoppingList.value
          .split("\n")
          .map(
            item => item.trim()
          )
          .filter(
            item => item.length > 0
          );


      message.innerHTML = "";

      results.classList.add(
        "hidden"
      );

      selectionBox.classList.add(
        "hidden"
      );


      if (!postcode) {

        message.innerHTML =
          '<div class="error">Skriv in ditt postnummer.</div>';

        return;

      }


      if (
        !/^\d{5}$/.test(
          postcode
        )
      ) {

        message.innerHTML =
          '<div class="error">Postnumret mÃ¥ste innehÃ¥lla 5 siffror.</div>';

        return;

      }


      if (!items.length) {

        message.innerHTML =
          '<div class="error">Skriv minst en vara i inkÃ¶pslistan.</div>';

        return;

      }


      findProductsButton.disabled =
        true;

      findProductsButton.textContent =
        "â³ Hittar produkter...";


      message.innerHTML =
        '<div class="loading">HÃ¤mtar produktalternativ...</div>';


      try {

        allResults = [];


        for (
          const item of items
        ) {

          const products =
            await getProducts(
              item,
              postcode
            );


          allResults.push({

            item,

            products,

            selectedProduct:
              null,

            visibleCount:

            activeGroup:

        selectionBox.classList.remove(
          "hidden"

          behavior: "smooth",
          block: "start"
        });


      } catch (error) {

        console.error(error);


        message.innerHTML = `

          <div class="error">

            NÃ¥got gick fel nÃ¤r produkterna
            skulle hÃ¤mtas.

            <br><br>

            ${escapeHtml(

        `;

      } finally {

        findProductsButton.disabled =
          false;

        findProductsButton.textContent =
          "ðŸ”Ž Hitta produkter";

      }

    }
  );
