<style>

.total {

function money(value) {
return value.toFixed(2).replace(".",",") + " kr";
}


function normalize(text) {
return text.toLowerCase().trim();
}


function compareBasket() {

const input = document.getElementById("shoppingList").value;

const error = document.getElementById("error");
const results = document.getElementById("results");

error.classList.add("hidden");
results.classList.add("hidden");

const items = input
.split("\n")
.map(normalize)
.filter(item => item.length > 0);

if(items.length === 0){

error.textContent =
"Skriv minst en vara i inköpslistan.";

error.classList.remove("hidden");

return;
}


const unknown = items.filter(item => !products[item]);

if(unknown.length > 0){

error.innerHTML =
"Jag hittar inte dessa testvaror ännu:<br><strong>" +
unknown.join(", ") +
"</strong>";

error.classList.remove("hidden");

}


const knownItems = items.filter(item => products[item]);

if(knownItems.length === 0){
return;
}


showOneStore(knownItems);

showCheapest(knownItems);

showSmart(knownItems);

results.classList.remove("hidden");

}


function showOneStore(items){

let bestStore = null;
let bestTotal = Infinity;


stores.forEach(store => {

let total = 0;

items.forEach(item => {

total += products[item][store].member;

});


if(total < bestTotal){

bestTotal = total;
bestStore = store;

}

});


let html = "";

html += "<div class='total'>" +
money(bestTotal) +
"</div>";

html += "<div class='small'>" +
"Billigast om allt köps i samma butik." +
"</div>";


html += "<div class='store'>" +
"<strong>" + bestStore + "</strong>";


items.forEach(item => {

html +=
"<div class='item'>" +
"<span>" + item + "</span>" +
"<span>" +
money(products[item][bestStore].member) +
"</span>" +
"</div>";

});


html += "</div>";


document.getElementById("oneStore").innerHTML = html;

}


function showCheapest(items){

});

cheapestPrice = price;
cheapestStore = store;

}

});

breakdown[cheapestStore].push({
item:item,
price:cheapestPrice
});

});


let html = "";

html +=
"<div class='total'>" +

"</div>";

html +=
"<div class='small'>" +

html +=
"<div class='item'>" +
"<span>" + x.item + "</span>" +
"<span>" + money(x.price) + "</span>" +
"</div>";

});


html += "</div>";

});


document.getElementById("cheapest").innerHTML = html;

}
